variables:
  RAILWAY_SERVICE: "parsun-app"

stages:
  - build
  - package
  - deploy

build:angular:
  stage: build
  image: oven/bun:1-slim
  script:
    - bun install --frozen-lockfile
    - bunx ng build --configuration production
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main
    - tags
    - merge_requests
    - develop

package:docker:
  stage: package
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build -f Dockerfile -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - tags

deploy:railway:
  stage: deploy
  image: node:20-slim
  before_script:
    - npm install -g @railway/cli
    - |
      if [ -z "$RAILWAY_API_TOKEN" ]; then
        echo "ERROR: RAILWAY_API_TOKEN is not set"
        exit 1
      fi
  script:
    - chmod +x scripts/railway-deploy.sh
    - sh scripts/railway-deploy.sh
  environment:
    name: production
    url: https://parsun-app-production.up.railway.app
  when: manual
  only:
    - main
    - tags

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
