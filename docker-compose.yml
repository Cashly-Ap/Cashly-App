services:
  # Development service
  parsun-app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: parsun-app-dev
    ports:
      - '4200:4200'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://parsun-api-app:8080
    profiles:
      - dev
    restart: unless-stopped
    networks:
      - parsun-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4200']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Production service
  parsun-app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parsun-app-prod
    ports:
      - '4200:4200'
    environment:
      - NODE_ENV=production
      - PORT=4200
    profiles:
      - prod
    restart: unless-stopped

  parsun-app-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: parsun-app-test
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
    profiles:
      - test
    command: bun test:run
    restart: 'no'

networks:
  parsun-network:
    external: true
    name: parsun-api_parsun-network
