<button
  type="button"
  (click)="themeService.toggleTheme()"
  class="relative flex items-center w-14 h-8 bg-surface-200 dark:bg-surface-700 rounded-full transition-colors duration-300 hover:bg-surface-300 dark:hover:bg-surface-600 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 dark:focus:ring-offset-surface-900"
  [attr.aria-label]="themeService.isDarkMode() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
>
  <span
    class="absolute left-1 w-6 h-6 bg-white dark:bg-surface-800 rounded-full shadow-md transition-transform duration-300 flex items-center justify-center dark:translate-x-6"
  >
    <i class="pi pi-sun absolute text-sm text-yellow-500 opacity-100 dark:opacity-0 transition-opacity duration-300"></i>
    <i class="pi pi-moon absolute text-sm text-blue-400 opacity-0 dark:opacity-100 transition-opacity duration-300"></i>
  </span>
</button>
