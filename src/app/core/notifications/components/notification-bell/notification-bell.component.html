<button
  (click)="togglePanel($event)"
  class="relative w-10 h-10 rounded-lg hover:bg-surface-100 dark:hover:bg-surface-800 flex items-center justify-center transition-colors cursor-pointer border-0 bg-transparent"
  pTooltip="Notificaciones"
>
  <i class="pi pi-bell text-surface-600 dark:text-surface-400 text-lg"></i>
  @if (unreadCount() > 0) {
    <span class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] flex items-center justify-center rounded-full bg-red-500 text-white text-[10px] font-bold px-1 leading-none">
      {{ unreadCount() > 99 ? '99+' : unreadCount() }}
    </span>
  }
</button>

<p-popover #panel [style]="{ width: '380px' }">
  <div class="flex flex-col">
    <div class="flex items-center justify-between px-4 py-3 border-b border-surface-200 dark:border-surface-700">
      <span class="font-semibold text-sm">Notificaciones</span>
      <div class="flex gap-1">
        @if (unreadCount() > 0) {
          <p-button label="Leídas" [text]="true" size="small" (onClick)="markAllAsRead()" />
        }
        @if (notifications().length > 0) {
          <p-button icon="pi pi-trash" [text]="true" size="small" severity="danger" (onClick)="clearAll()" pTooltip="Limpiar todas" />
        }
      </div>
    </div>
    <div class="overflow-y-auto max-h-[400px]">
      @if (loading()) {
        <div class="flex items-center justify-center py-8">
          <i class="pi pi-spin pi-spinner text-surface-400"></i>
        </div>
      } @else if (notifications().length === 0) {
        <div class="flex flex-col items-center justify-center py-8 text-surface-400">
          <i class="pi pi-bell-slash text-3xl mb-2"></i>
          <span class="text-sm">No hay notificaciones</span>
        </div>
      } @else {
        @for (n of notifications(); track n.id) {
          <div
              class="flex items-start gap-3 px-4 py-3 hover:bg-surface-50 dark:hover:bg-surface-800 cursor-pointer border-b border-surface-100 dark:border-surface-800 last:border-b-0"
              (click)="markAsRead(n)"
            >
              <div class="w-2 h-2 rounded-full mt-2 shrink-0 bg-primary"></div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-surface-900 dark:text-surface-100 truncate">{{ n.title }}</p>
              <p class="text-xs text-surface-500 mt-0.5 line-clamp-2">{{ n.message }}</p>
              <p class="text-xs text-surface-400 mt-1">{{ timeAgo(n.createdAt) }}</p>
            </div>
          </div>
        }
      }
    </div>
  </div>
</p-popover>
