<p-dialog
  [visible]="pdfService.visible()"
  [modal]="true"
  [maximizable]="false"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [style]="getDialogStyle()"
  [contentStyle]="getContentStyle()"
  [showHeader]="true"
  [closeOnEscape]="true"
  (onHide)="onClose()"
  styleClass="pdf-viewer-dialog"
>
  <ng-template pTemplate="header">
    <div class="flex items-center justify-between w-full gap-2" [class.pr-8]="!isMobile()">
      <span
        class="font-semibold text-surface-900 dark:text-surface-0 truncate"
        [class.text-base]="isMobile()"
        [class.text-lg]="!isMobile()"
      >
        {{ pdfService.config()?.title }}
      </span>

      <div class="flex gap-1 sm:gap-2 flex-shrink-0">
        @if (isMobile()) {
          <p-button
            icon="pi pi-download"
            [rounded]="true"
            [text]="true"
            size="large"
            [disabled]="pdfService.loading() || !!pdfService.error()"
            (onClick)="onDownload()"
            pTooltip="Descargar"
            tooltipPosition="bottom"
          />
        } @else if (isSmallScreen()) {
          <p-button
            icon="pi pi-download"
            [rounded]="true"
            [outlined]="true"
            size="small"
            [disabled]="pdfService.loading() || !!pdfService.error()"
            (onClick)="onDownload()"
            pTooltip="Descargar"
            tooltipPosition="bottom"
          />
          <p-button
            icon="pi pi-expand"
            [rounded]="true"
            [outlined]="true"
            size="small"
            [disabled]="pdfService.loading() || !!pdfService.error()"
            (onClick)="onFullscreen()"
            pTooltip="Pantalla completa"
            tooltipPosition="bottom"
          />
        } @else {
          <p-button
            icon="pi pi-download"
            label="Descargar"
            [outlined]="true"
            size="small"
            [disabled]="pdfService.loading() || !!pdfService.error()"
            (onClick)="onDownload()"
          />
          <p-button
            icon="pi pi-expand"
            label="Pantalla Completa"
            [outlined]="true"
            size="small"
            [disabled]="pdfService.loading() || !!pdfService.error()"
            (onClick)="onFullscreen()"
          />
        }
      </div>
    </div>
  </ng-template>

  <div class="w-full h-full flex items-center justify-center bg-surface-100 dark:bg-surface-900">
    @if (pdfService.loading()) {
      <div class="flex flex-col items-center gap-4 p-4">
        <p-progressSpinner strokeWidth="4" [style]="{ width: '50px', height: '50px' }" />
        <span class="text-surface-600 dark:text-surface-400 text-center"
          >Cargando documento...</span
        >
      </div>
    } @else if (pdfService.error()) {
      <div class="flex flex-col items-center gap-4 text-center px-6 py-8">
        <i class="pi pi-exclamation-circle text-5xl text-red-500"></i>
        <span class="text-red-600 dark:text-red-400 text-sm sm:text-base">{{
          pdfService.error()
        }}</span>
        <p-button label="Cerrar" severity="secondary" (onClick)="onClose()" />
      </div>
    } @else if (pdfService.pdfSafeUrl()) {
      <iframe
        [src]="pdfService.pdfSafeUrl()"
        class="w-full h-full border-0"
        type="application/pdf"
        title="Visor de PDF"
      ></iframe>
    }
  </div>
</p-dialog>
