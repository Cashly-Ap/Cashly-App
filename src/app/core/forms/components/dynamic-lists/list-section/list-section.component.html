<div [class]="containerClass()">
  <div class="flex justify-between items-center mb-3">
    <h3
      class="text-base font-medium text-surface-800 dark:text-surface-200 flex items-center gap-2"
    >
      @if (icon()) {
        <i [class]="'pi ' + icon() + ' text-surface-500'"></i>
      }
      {{ title() | translate }}
    </h3>
    <p-button
      [label]="addButtonLabel() | translate"
      icon="pi pi-plus"
      size="small"
      (onClick)="add.emit()"
      [text]="true"
    />
  </div>

  @if (isEmpty()) {
    <div
      class="text-center py-6 border border-dashed border-surface-200 dark:border-surface-700 rounded-lg"
    >
      @if (emptyIcon()) {
        <i [class]="'pi text-3xl mb-2 text-surface-400 dark:text-surface-500 ' + emptyIcon()"></i>
      }
      <p class="text-sm text-surface-500 dark:text-surface-400">
        {{ emptyMessage() | translate }}
      </p>
    </div>
  }

  <div [class]="contentClass()">
    <ng-content />
  </div>
</div>
