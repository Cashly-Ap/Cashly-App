<div class="p-3 mt-3 rounded-lg border border-surface-200 dark:border-surface-800 bg-white dark:bg-surface-950">
  <div class="flex gap-2">
    @if (icon()) {
      <i [class]="'pi ' + icon() + ' text-surface-500 dark:text-surface-400 mt-3'"></i>
    }

    <input
      pInputText
      [formControl]="control()"
      [placeholder]="placeholder()"
      [type]="inputType()"
      class="flex-1 min-w-0"
      [ngClass]="{ 'ng-invalid ng-dirty': control().invalid && control().touched }"
    />

    <p-button
      icon="pi pi-trash"
      severity="secondary"
      size="small"
      [text]="true"
      [rounded]="true"
      (onClick)="remove.emit()"
      styleClass="flex-shrink-0"
    />
  </div>

  @if (control().invalid && control().touched) {
    <div class="min-h-[18px] mt-1.5">
      <small class="block text-red-500 text-xs">
        {{ displayError() }}
      </small>
    </div>
  }
</div>
