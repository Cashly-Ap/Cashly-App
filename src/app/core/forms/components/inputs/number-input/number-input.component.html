<div
  class="rounded-xl p-4 bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 hover:border-surface-300 dark:hover:border-surface-600"
  [class.lg:col-span-2]="colSpan() === 2"
>
  <label class="block text-sm font-semibold text-surface-700 dark:text-surface-300 mb-2">
    @if (icon()) {
      <i class="pi {{ icon() }} mr-1.5 text-primary-500 dark:text-primary-400"></i>
    }
    {{ label() }}
  </label>
  <div class="w-full">
    <p-inputNumber
      [formControl]="control()"
      [min]="min()"
      [max]="max()"
      [mode]="mode()"
      [prefix]="prefix()"
      [suffix]="suffix()"
      [placeholder]="placeholder()"
      [minFractionDigits]="minFractionDigits()"
      [maxFractionDigits]="maxFractionDigits()"
      [showButtons]="showButtons()"
      buttonLayout="horizontal"
      incrementButtonIcon="pi pi-plus"
      decrementButtonIcon="pi pi-minus"
      inputStyleClass="w-full text-left"
      styleClass="w-full"
    />
  </div>
  <div class="min-h-[20px] mt-1.5">
    @if (control().invalid && control().touched && errorMessage()) {
      <small class="flex items-center gap-1 text-red-500 text-xs">
        <i class="pi pi-exclamation-circle text-xs"></i>
        {{ errorMessage() }}
      </small>
    } @else if (helpText()) {
      <p class="flex items-center gap-1 text-xs text-surface-500 dark:text-surface-400">
        <i class="pi pi-info-circle text-xs"></i>
        {{ helpText() }}
      </p>
    }
  </div>
</div>
