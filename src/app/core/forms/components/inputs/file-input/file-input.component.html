<div
  class="rounded-xl p-4 bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 hover:border-surface-300 dark:hover:border-surface-600"
>
  <label class="block text-sm font-semibold text-surface-700 dark:text-surface-300 mb-2">
    {{ label() }}
  </label>

  @if (previewImageUrl()) {
    <div class="mb-3">
      <div class="relative w-full max-w-xs mx-auto">
        <div
          class="w-full aspect-square rounded-xl overflow-hidden bg-surface-100 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 flex items-center justify-center"
        >
          <img
            [src]="previewImageUrl()!"
            alt="Vista previa"
            (error)="onPreviewError()"
            class="w-full h-full object-contain p-4"
          />
        </div>
        <p-button
          icon="pi pi-times"
          ariaLabel="Eliminar imagen"
          severity="secondary"
          [rounded]="true"
          size="small"
          class="absolute -top-2 -right-2"
          (onClick)="removeCurrentImage()"
          pTooltip="Eliminar imagen"
        />
      </div>
    </div>
  }

  <p-fileupload
    class="block [&_input[type=file]]:sr-only"
    mode="basic"
    [accept]="accept()"
    [maxFileSize]="maxFileSize()"
    [auto]="false"
    chooseLabel="Seleccionar archivo"
    chooseIcon="pi pi-upload"
    (onSelect)="onSelect($event)"
    (onRemove)="onRemove($event)"
    (onClear)="onClear()"
    styleClass="w-full"
  />

  <div class="min-h-[20px] mt-1.5">
    @if (control().invalid && control().touched && errorMessage()) {
      <small class="flex items-center gap-1 text-red-500 text-xs">
        <i class="pi pi-exclamation-circle text-xs"></i>
        {{ errorMessage() }}
      </small>
    } @else if (helpText()) {
      <p class="flex items-center gap-1 text-xs text-surface-500 dark:text-surface-400">
        <i class="pi pi-info-circle text-xs"></i>
        {{ helpText() }}
      </p>
    }
  </div>
</div>
