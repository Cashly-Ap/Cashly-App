<div
  class="flex items-center gap-3 rounded-xl p-4 bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 hover:border-surface-300 dark:hover:border-surface-600"
  [style.grid-column]="'span ' + colSpan()"
>
  @if (icon()) {
    <i [class]="'pi ' + icon() + ' text-primary-500 dark:text-primary-400 text-lg'"></i>
  }
  <label class="flex-1 cursor-pointer flex items-center">
    <p-checkbox [formControl]="internalControl()" [binary]="true" />
    <span class="ml-2.5 font-semibold text-surface-700 dark:text-surface-300">{{ label() }}</span>
  </label>
</div>
