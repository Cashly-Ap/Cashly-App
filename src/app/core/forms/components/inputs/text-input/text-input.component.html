<div
  class="rounded-xl p-4 bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 hover:border-surface-300 dark:hover:border-surface-600"
  [ngClass]="containerClass()"
>
  <label
    [for]="label()"
    class="block text-sm font-semibold text-surface-700 dark:text-surface-300 mb-2"
  >
    {{ label() }}
  </label>
  @if (variant() === 'password') {
    <p-password
      [formControl]="control()"
      [toggleMask]="true"
      [feedback]="false"
      [placeholder]="placeholder()"
      styleClass="w-full"
      inputStyleClass="w-full"
    />
  } @else {
    <input
      [id]="label()"
      [formControl]="control()"
      [placeholder]="placeholder()"
      [readonly]="readonly()"
      pInputText
      class="w-full"
      [class.bg-surface-100]="readonly()"
      [class.dark:bg-surface-800]="readonly()"
      [class.cursor-not-allowed]="readonly()"
    />
  }
  <div class="min-h-[20px] mt-1.5">
    @if (control().invalid && control().touched && errorMessage()) {
      <small class="flex items-center gap-1 text-red-500 text-xs">
        <i class="pi pi-exclamation-circle text-xs"></i>
        {{ errorMessage() }}
      </small>
    }
  </div>
</div>
