<div
  class="flex flex-col sm:flex-row gap-3 sm:justify-end bg-surface-50 dark:bg-surface-900 border-t border-surface-200 dark:border-surface-800 px-4 md:px-6 py-4"
>
  <p-button
    [label]="cancelLabel()"
    icon="pi pi-times"
    severity="secondary"
    [outlined]="true"
    (onClick)="cancel.emit()"
    [disabled]="loading()"
  />
  <p-button
    type="submit"
    [label]="submitLabel()"
    icon="pi pi-check"
    severity="contrast"
    [loading]="loading()"
    [disabled]="disabled()"
  />
</div>
