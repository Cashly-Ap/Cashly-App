<div
  class="flex flex-col sm:flex-row gap-3 sm:justify-end bg-surface-50 dark:bg-surface-900 border-t border-surface-200 dark:border-surface-800 px-4 md:px-6 py-4"
>
  <ng-content />
  <app-cancel-button
    [labelKey]="cancelLabel()"
    [disabled]="loading()"
    [outlined]="true"
    (cancelled)="cancel.emit()"
  />
  <span
    [pTooltip]="resolvedTooltip()"
    tooltipPosition="top"
    [tooltipOptions]="{ showDelay: 200 }"
    class="inline-flex"
  >
    <app-submit-button
      type="submit"
      [label]="submitLabel()"
      [loading]="loading()"
      [disabled]="submitDisabled()"
    />
  </span>
</div>
