<button
  type="button"
  [disabled]="disabled()"
  class="flex w-full items-center gap-2 rounded-lg border border-surface-200 bg-white px-3 py-2.5 text-sm text-surface-400 transition-colors hover:border-surface-400 disabled:cursor-not-allowed disabled:opacity-60 dark:border-surface-700 dark:bg-surface-800 dark:text-surface-500 dark:hover:border-surface-500"
  (click)="open.emit()"
>
  <i [class]="icon() + ' text-sm'"></i>
  {{ labelKey() | translate }}
</button>
