<div class="flex w-full items-center gap-2">
  <p-iconField class="min-w-0 flex-1">
    <p-inputIcon styleClass="pi pi-search" />
    <input
      appShortcut="search"
      #searchInput
      pInputText
      type="text"
      [value]="draft()"
      [placeholder]="placeholder() | translate"
      [disabled]="disabled()"
      (input)="draft.set(searchInput.value)"
      (keydown.enter)="submit(); $event.preventDefault()"
      class="w-full !pr-10"
    />
    @if (draft()) {
      <button
        type="button"
        [attr.aria-label]="'shared.clearSearch' | translate"
        class="absolute right-2 top-1/2 z-10 inline-flex h-7 w-7 -translate-y-1/2 items-center justify-center rounded-full text-surface-500 transition-colors hover:bg-surface-100 hover:text-black disabled:cursor-not-allowed disabled:opacity-50 dark:text-surface-400 dark:hover:bg-surface-800 dark:hover:text-white"
        [disabled]="disabled()"
        [pTooltip]="'shared.clearSearch' | translate"
        tooltipPosition="top"
        (click)="clear()"
      >
        <i class="pi pi-times text-xs"></i>
      </button>
    }
  </p-iconField>
  <p-button
    icon="pi pi-search"
    [ariaLabel]="buttonLabel() | translate"
    [outlined]="true"
    [rounded]="true"
    [disabled]="disabled()"
    (onClick)="submit()"
    [pTooltip]="buttonLabel()"
    tooltipPosition="top"
    styleClass="!h-10 !w-10 !shrink-0 !border-surface-300 !bg-white !p-0 !text-black hover:!bg-surface-100 dark:!border-surface-700 dark:!bg-surface-950 dark:!text-white dark:hover:!bg-surface-800"
  />
</div>
