<div class="flex items-center gap-3">
  <div
    class="flex items-center justify-center w-9 h-9 rounded-full bg-surface-100 dark:bg-surface-800 shrink-0"
  >
    <i [class]="icon() + ' text-surface-600 dark:text-surface-300 text-lg'"></i>
  </div>
  <div class="flex flex-col">
    <span class="text-base font-semibold text-surface-900 dark:text-surface-0">{{
      title() | translate
    }}</span>
    @if (subtitle()) {
      <span class="text-xs text-surface-500 dark:text-surface-400">{{
        subtitle() | translate
      }}</span>
    }
  </div>
</div>
