<div class="cashly-page-header relative mb-8 pr-24 text-left sm:pr-32">
  @if (kicker()) {
    <p
      class="text-xs font-medium uppercase tracking-[0.16em] text-surface-500 dark:text-surface-400 mb-3"
    >
      {{ kicker() | translate }}
    </p>
  }
  <h1
    class="text-3xl sm:text-4xl font-bold tracking-tight text-surface-900 dark:text-surface-0 mb-3"
  >
    {{ title() | translate }}
  </h1>
  @if (subtitle()) {
    <p class="text-sm sm:text-base text-surface-500 dark:text-surface-400">
      {{ subtitle() | translate }}
    </p>
  }

  @if (showIcon() && displayIcon(); as headerIcon) {
    <span
      class="cashly-page-icon absolute right-0 top-0 flex size-20 items-center justify-center rounded-full sm:size-28"
      aria-hidden="true"
    >
      <i [class]="headerIcon + ' text-4xl sm:text-5xl'"></i>
    </span>
  }
</div>
