@if (shortcut()) {
  <p-button
    [appShortcut]="shortcut()!"
    icon="pi pi-filter"
    [class]="buttonClass()"
    [outlined]="true"
    severity="secondary"
    [attr.data-testid]="testId()"
    [ariaLabel]="tooltipKey() | translate"
    [pTooltip]="tooltipKey() | translate"
    [badge]="hasActiveFilters() ? activeCount().toString() : ''"
    badgeSeverity="contrast"
    (onClick)="filterPopover.toggle($event)"
  />
} @else {
  <p-button
    icon="pi pi-filter"
    [class]="buttonClass()"
    [outlined]="true"
    severity="secondary"
    [attr.data-testid]="testId()"
    [ariaLabel]="tooltipKey() | translate"
    [pTooltip]="tooltipKey() | translate"
    [badge]="hasActiveFilters() ? activeCount().toString() : ''"
    badgeSeverity="contrast"
    (onClick)="filterPopover.toggle($event)"
  />
}

<p-popover #filterPopover [appendTo]="appendTo()" [focusOnShow]="false">
  <div [class]="isCompact() ? 'w-64' : 'flex flex-col gap-4 p-1 min-w-[260px]'">
    <div
      [class]="
        isCompact()
          ? 'flex items-center justify-between px-4 py-3 border-b border-surface-100 dark:border-surface-800'
          : 'flex items-center justify-between'
      "
    >
      <span
        [class]="
          isCompact()
            ? 'text-sm font-semibold text-surface-900 dark:text-surface-0'
            : 'font-semibold text-sm'
        "
        >{{ titleKey() | translate }}</span
      >
      @if (hasActiveFilters()) {
        <p-button
          [label]="clearLabelKey() | translate"
          [text]="true"
          size="small"
          severity="secondary"
          (onClick)="cleared.emit()"
        />
      }
    </div>

    <div [class]="isCompact() ? 'px-4 py-3 flex flex-col gap-3' : 'flex flex-col gap-4'">
      <ng-content />
    </div>

    @for (field of fields(); track field.key) {
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-surface-500">{{ field.labelKey | translate }}</label>

        @switch (field.type) {
          @case ('select') {
            <p-select
              [options]="fieldOptions(field) | translateOptions"
              [ngModel]="fieldValue(field)"
              optionLabel="label"
              optionValue="value"
              [placeholder]="field.placeholderKey ? (field.placeholderKey | translate) : ''"
              styleClass="w-full"
              (onChange)="changeField(field, $event.value)"
            />
          }
          @case ('date') {
            <p-datePicker
              [ngModel]="fieldDate(field)"
              [showIcon]="true"
              [dateFormat]="dateFormat()"
              [placeholder]="field.placeholderKey ? (field.placeholderKey | translate) : ''"
              styleClass="w-full"
              (onSelect)="changeDate(field, $event)"
            />
          }
          @case ('number') {
            <input
              pInputText
              type="number"
              class="w-full"
              [ngModel]="fieldValue(field)"
              [placeholder]="field.placeholderKey ? (field.placeholderKey | translate) : ''"
              (ngModelChange)="onTextChange(field, $event)"
            />
          }
          @default {
            <input
              pInputText
              type="text"
              class="w-full"
              [ngModel]="fieldValue(field)"
              [placeholder]="field.placeholderKey ? (field.placeholderKey | translate) : ''"
              (ngModelChange)="onTextChange(field, $event)"
            />
          }
        }
      </div>
    }
  </div>
</p-popover>
