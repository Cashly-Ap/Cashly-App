<div class="px-4 sm:px-6 py-5 border-b-2 border-surface-200 dark:border-surface-700">
  <div
    class="flex flex-col sm:flex-row gap-3 sm:gap-4 items-stretch sm:items-center justify-between"
  >
    <div class="flex-1">
      <h1
        class="text-2xl sm:text-3xl font-bold mb-1"
        [class.text-orange-500]="titleClass().includes('text-orange-500')"
        [class.text-orange-600]="titleClass().includes('text-orange-600')"
        [class.text-red-600]="titleClass().includes('text-red-600')"
        [class.text-surface-500]="titleClass().includes('text-surface-500')"
      >
        {{ title() | translate }}
      </h1>
      @if (subtitle()) {
        <p class="text-base text-surface-600 dark:text-surface-400">
          {{ subtitle() | translate }}
        </p>
      }
    </div>
    <div class="flex gap-2 flex-col sm:flex-row w-full sm:w-auto flex-shrink-0">
      <ng-content select="[actions]"></ng-content>
    </div>
  </div>
</div>
