<app-main-layout>
  <div class="min-h-screen">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-4 sm:py-6">
      @if (loading()) {
        <app-loading-spinner />
      }
      @if (paymentMethod(); as pm) {
        <div class="flex flex-col gap-6">
          <app-page-header
            title="Detalles del Método de Pago"
            subtitle="Información completa del método de pago"
          />

          <app-details-card>
            <app-details-card-header
              [title]="pm.name"
              [subtitle]="'Código: ' + pm.code"
            >
              <div actions class="flex gap-3 flex-wrap">
                <p-button
                  label="Volver"
                  icon="pi pi-arrow-left"
                  [outlined]="true"
                  (onClick)="onBack()"
                  styleClass="w-full sm:w-auto"
                />
                <p-button
                  label="Editar"
                  icon="pi pi-pencil"
                  severity="contrast"
                  (onClick)="onEdit()"
                  styleClass="w-full sm:w-auto"
                />
              </div>
            </app-details-card-header>

            <div class="p-4 sm:p-6">
              <app-details-info-grid>
                <app-details-info-field
                  label="Código"
                  [value]="pm.code"
                  type="code"
                />
                <app-details-info-field
                  label="Nombre"
                  [value]="pm.name"
                />
                <app-details-info-field label="Estado" type="badge">
                  <app-status-badge
                    [active]="pm.isActive"
                    activeLabel="Activo"
                    inactiveLabel="Inactivo"
                  />
                </app-details-info-field>
                @if (pm.description) {
                  <app-details-info-field
                    label="Descripción"
                    [value]="pm.description"
                  />
                } @else {
                  <app-details-info-field
                    label="Descripción"
                    value="—"
                  />
                }
                <app-details-info-field
                  label="Fecha de Creación"
                  [value]="(pm.createdAt | date: 'dd/MM/yyyy HH:mm') || ''"
                />
                <app-details-info-field
                  label="Última Actualización"
                  [value]="(pm.updatedAt | date: 'dd/MM/yyyy HH:mm') || ''"
                />
              </app-details-info-grid>
            </div>
          </app-details-card>
        </div>
      }
    </div>
  </div>
  <p-confirmDialog styleClass="max-w-md" />
</app-main-layout>
