<app-main-layout>
  <div class="min-h-screen">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 sm:py-6">
      @if (loading()) {
        <app-loading-spinner />
      }
      @if (debitNote(); as dn) {
        <div class="flex flex-col gap-6">
          <app-page-header
            title="Detalles de la Nota de Débito"
            subtitle="Información completa de la nota de débito"
          />

          <app-details-card>
            <app-details-card-header
              [title]="dn.noteNumber"
              [subtitle]="'Monto: ' + (dn.amount | number:'1.2-2')"
            >
              <div actions class="flex gap-3">
                <p-button
                  label="Volver"
                  icon="pi pi-arrow-left"
                  [outlined]="true"
                  (onClick)="onBack()"
                  styleClass="w-full sm:w-auto"
                />
                <p-button
                  label="Eliminar"
                  icon="pi pi-trash"
                  severity="danger"
                  (onClick)="onDelete()"
                  styleClass="w-full sm:w-auto"
                />
              </div>
            </app-details-card-header>

            <div class="p-4 sm:p-6">
              <app-details-info-grid>
                <app-details-info-field
                  label="Número"
                  [value]="dn.noteNumber"
                  type="code"
                />
                <app-details-info-field
                  label="Cliente"
                  [value]="dn.customerName || '—'"
                />
                <app-details-info-field
                  label="RIF"
                  [value]="dn.customerRif || '—'"
                  type="code"
                />
                <app-details-info-field
                  label="Factura"
                  [value]="dn.invoiceNumber || '—'"
                  type="code"
                />
                <app-details-info-field
                  label="Monto"
                  [value]="(dn.amount | number:'1.2-2') || ''"
                />
                <app-details-info-field
                  label="Creado por"
                  [value]="dn.createdByName"
                />
                <app-details-info-field
                  label="Fecha de Creación"
                  [value]="(dn.createdAt | date: 'dd/MM/yyyy HH:mm') || ''"
                />
                <app-details-info-field
                  label="Última Actualización"
                  [value]="(dn.updatedAt | date: 'dd/MM/yyyy HH:mm') || ''"
                />
              </app-details-info-grid>
            </div>
          </app-details-card>

          @if (dn.reason) {
            <app-details-card>
              <app-details-card-header title="Motivo" />
              <div class="p-4 sm:p-6">
                <p class="text-sm text-surface-700 dark:text-surface-300 whitespace-pre-wrap leading-relaxed">{{ dn.reason }}</p>
              </div>
            </app-details-card>
          }
        </div>
      }
    </div>
  </div>
  <p-confirmDialog styleClass="max-w-md" />
</app-main-layout>
