<app-report-pdf-modal
  titleKey="inventory.warehouses.movementHistory2"
  width="500px"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  (show)="loadFilters()"
>
  @if (loading()) {
    <div class="flex justify-center py-10">
      <p-progressSpinner strokeWidth="4" styleClass="w-10 h-10" />
    </div>
  } @else {
    <div class="flex flex-col gap-4 pt-2">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{
          'inventory.warehouses.warehouse' | translate
        }}</label>
        <p-select
          [options]="warehouseOptions() | translateOptions: true"
          [(ngModel)]="warehouseId"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          [placeholder]="'inventory.warehouses.allWarehouses' | translate"
          styleClass="w-full"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{
          'inventory.warehouses.movementType' | translate
        }}</label>
        <p-select
          [options]="movementTypeOptions | translateOptions"
          [(ngModel)]="movementType"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          [placeholder]="'finance.billing.invoices.allTypes' | translate"
          styleClass="w-full"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{
          'finance.billing.invoices.from' | translate
        }}</label>
        <p-datepicker
          [(ngModel)]="from"
          dateFormat="dd/mm/yy"
          [placeholder]="'finance.treasury.cashregister.selectStartDate' | translate"
          styleClass="w-full"
          appendTo="body"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{
          'finance.billing.invoices.to' | translate
        }}</label>
        <p-datepicker
          [(ngModel)]="to"
          dateFormat="dd/mm/yy"
          [placeholder]="'finance.treasury.cashregister.selectEndDate' | translate"
          styleClass="w-full"
          appendTo="body"
        />
      </div>
    </div>
  }

  <ng-container reportFooter>
    <div class="flex gap-2 justify-end">
      <p-button
        [appPermissionModule]="'INVENTORY_WAREHOUSES'"
        [appPermission]="'EXPORT'"
        [label]="'finance.treasury.cashregister.excel' | translate"
        icon="pi pi-file-excel"
        (onClick)="generateExcel()"
        severity="success"
        styleClass="p-button-outlined"
      />
      <p-button
        [appPermissionModule]="'INVENTORY_WAREHOUSES'"
        [appPermission]="'EXPORT'"
        [label]="'inventory.warehouses.viewPdf' | translate"
        icon="pi pi-file-pdf"
        (onClick)="generatePdf()"
        severity="primary"
      />
    </div>
  </ng-container>
</app-report-pdf-modal>
