<app-main-layout>
  <app-form-container>
    <app-form-header
      [title]="isEditMode() ? 'Editar Pedido' : 'Nuevo Pedido'"
      [subtitle]="isEditMode() ? 'Modifica los datos del pedido' : 'Complete la información del pedido'"
    />
    <form [formGroup]="form" (ngSubmit)="submit()">
      <app-form-card>
        <div class="p-4 md:p-6">
          <h3 class="text-base font-medium mb-4 text-surface-800 dark:text-surface-200 flex items-center gap-2">
            <i class="pi pi-info-circle text-surface-500"></i>
            Información del Pedido
          </h3>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-1 md:col-span-2 lg:col-span-3 rounded-xl p-4 bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 hover:border-surface-300 dark:hover:border-surface-600">
              <label class="block text-sm font-semibold text-surface-700 dark:text-surface-300 mb-2">
                Cliente *
              </label>
              @if (selectedCustomerLabel(); as customer) {
                <div class="flex items-center justify-between gap-3 px-3 py-2.5 rounded-lg bg-white dark:bg-surface-800 border border-surface-200 dark:border-surface-700">
                  <div class="flex flex-col min-w-0">
                    <span class="text-sm font-medium text-surface-900 dark:text-surface-0 truncate">{{ customer.alias }}</span>
                    <span class="text-xs text-surface-500 dark:text-surface-400 truncate">{{ customer.legalName }}</span>
                  </div>
                  @if (!isEditMode()) {
                    <button
                      type="button"
                      class="shrink-0 text-xs text-surface-500 dark:text-surface-400 hover:text-surface-900 dark:hover:text-surface-0 underline transition-colors"
                      (click)="openPicker()"
                    >
                      Cambiar
                    </button>
                  }
                </div>
              } @else {
                <button
                  type="button"
                  class="w-full flex items-center gap-2 px-3 py-2.5 rounded-lg bg-white dark:bg-surface-800 border border-surface-200 dark:border-surface-700 hover:border-surface-400 dark:hover:border-surface-500 text-surface-400 dark:text-surface-500 text-sm transition-colors"
                  (click)="openPicker()"
                >
                  <i class="pi pi-search text-sm"></i>
                  Buscar y seleccionar cliente...
                </button>
              }
              <div class="min-h-[20px] mt-1.5">
                @if (form.get('customerId')?.invalid && form.get('customerId')?.touched) {
                  <small class="flex items-center gap-1 text-red-500 text-xs">
                    <i class="pi pi-exclamation-circle text-xs"></i>
                    El cliente es requerido
                  </small>
                }
              </div>
            </div>

            <div class="col-span-1 md:col-span-2 lg:col-span-3 rounded-xl p-4 bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 hover:border-surface-300 dark:hover:border-surface-600">
              <label class="block text-sm font-semibold text-surface-700 dark:text-surface-300 mb-2">
                Notas
                <span class="text-surface-400 text-xs font-normal ml-1">(opcional)</span>
              </label>
              <textarea
                pTextarea
                formControlName="notes"
                rows="3"
                class="w-full"
                placeholder="Notas o instrucciones adicionales..."
              ></textarea>
              <div class="min-h-[20px] mt-1.5"></div>
            </div>
          </div>
        </div>

        <div class="border-t border-surface-200 dark:border-surface-800">
          <app-order-items-table
            [items]="items()"
            [products]="products()"
            [readonly]="false"
            (itemsChange)="onItemsChange($event)"
          />
        </div>

        <app-form-actions
          submitLabel="Guardar"
          cancelLabel="Cancelar"
          [loading]="isSubmitting()"
          [disabled]="form.invalid"
          [tooltipMessage]="submitTooltip()"
          (cancel)="cancel()"
        />
      </app-form-card>
    </form>
  </app-form-container>
</app-main-layout>

<app-customer-picker-dialog
  [visible]="pickerVisible()"
  (customerSelected)="onCustomerSelected($event)"
  (cancelled)="onPickerCancelled()"
/>
