<p-dialog
  header="Convertir a Factura"
  [visible]="visible()"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '480px' }"
>
  <div class="flex flex-col gap-4 py-2">
    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-1">
        <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">Pedido</span>
        <span class="text-sm font-semibold text-gray-800"># {{ orderNumber() }}</span>
      </div>
      <div class="flex flex-col gap-1">
        <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">Cliente</span>
        <span class="text-sm font-semibold text-gray-800">{{ customerName() }}</span>
      </div>
      <div class="flex flex-col gap-1">
        <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">Total</span>
        <span class="text-sm font-semibold text-gray-800">
          {{ totalAmount() | number: '1.2-2' }}
        </span>
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button
        label="Cancelar"
        severity="secondary"
        [outlined]="true"
        (onClick)="onCancel()"
      />
      <p-button
        label="Confirmar"
        severity="success"
        (onClick)="onConfirm()"
      />
    </div>
  </ng-template>
</p-dialog>
