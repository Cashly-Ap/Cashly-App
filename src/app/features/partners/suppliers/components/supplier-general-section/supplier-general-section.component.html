<app-tab-content [columns]="2">
  <app-text-input
    [control]="control('legalName')"
    [label]="'partners.suppliers.legalName' | translate"
    [placeholder]="'partners.suppliers.acmeCorporationCA' | translate"
    [errorMessage]="'partners.suppliers.labels.theLegalNameIsRequiredAndMustContain2To300Characters' | translate"
  />

  <app-text-input
    [control]="control('rif')"
    [label]="'partners.suppliers.labels.taxId' | translate"
    placeholder="J-12345678-9"
    [errorMessage]="'partners.suppliers.labels.theTaxIdFormatIsInvalid' | translate"
  />

  <app-text-input
    [control]="control('alias')"
    [label]="'partners.suppliers.alias' | translate"
    [placeholder]="'partners.suppliers.acmeCorp' | translate"
    [errorMessage]="'partners.suppliers.labels.anAliasIsRequiredMaximum200Characters' | translate"
  />

  <app-select-input
    [control]="control('type')"
    [label]="'partners.suppliers.supplierType2' | translate"
    [placeholder]="'partners.suppliers.selectTheType' | translate"
    [options]="supplierTypes"
    optionLabel="label"
    optionValue="value"
    [errorMessage]="'partners.suppliers.labels.aSupplierTypeIsRequired' | translate"
  />

  @if (isEditMode()) {
    <div
      [formGroup]="form()"
      class="md:col-span-2 flex items-center justify-between p-4 rounded-lg border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-900"
    >
      <div>
        <p class="font-medium text-surface-800 dark:text-surface-200">{{ 'partners.suppliers.activeSupplier' | translate }}</p>
        <p class="text-sm text-surface-500 dark:text-surface-400 mt-0.5">
          {{ 'partners.suppliers.indicatesWhetherTheSupplierIsActiveInTheSystem' | translate }}
        </p>
      </div>
      <p-toggleswitch formControlName="active" />
    </div>
  }

  <div
    [formGroup]="form()"
    class="md:col-span-2 rounded-xl p-4 bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 hover:border-surface-300 dark:hover:border-surface-600"
  >
    <label class="block text-sm font-semibold text-surface-700 dark:text-surface-300 mb-2"
      >{{ 'finance.billing.invoices.notes' | translate }}</label
    >
    <textarea
      pTextarea
      formControlName="notes"
      rows="4"
      [placeholder]="'partners.suppliers.internalSupplierCommentsOrNotes' | translate"
      class="w-full resize-none"
    ></textarea>
  </div>
</app-tab-content>
