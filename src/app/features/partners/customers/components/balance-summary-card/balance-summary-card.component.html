<app-panel-card [overflowHidden]="true">
  <div class="p-6 sm:p-8">
    <div class="flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
      <div class="flex flex-col gap-5 sm:flex-row sm:items-center">
        <ng-content select="[filter]" />
        <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
          <div class="flex flex-col gap-1">
            <p
              class="text-xs text-surface-500 dark:text-surface-400 uppercase tracking-widest font-semibold"
            >
              {{ 'partners.customers.outstandingBalance' | translate }}
            </p>
            <p class="text-2xl sm:text-3xl font-extrabold tracking-tight text-red-600">
              {{ pendingBalance() | localizedCurrency: 'USD' : 'symbol' : '1.2-2' }}
            </p>
          </div>
          <div class="flex flex-col gap-1">
            <p
              class="text-xs text-surface-500 dark:text-surface-400 uppercase tracking-widest font-semibold"
            >
              {{ 'finance.treasury.receivables.creditBalance' | translate }}
            </p>
            <p class="text-2xl sm:text-3xl font-extrabold tracking-tight text-green-600">
              {{
                customerBalance()?.totalBalance ?? 0 | localizedCurrency: 'USD' : 'symbol' : '1.2-2'
              }}
            </p>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-2 sm:flex-row">
        <ng-content select="[actions]" />
      </div>
    </div>
  </div>
</app-panel-card>
