<app-tab-content [columns]="2">
  <app-text-input
    [control]="control('legalName')"
    label="Razón Social"
    placeholder="Acme Corporation C.A."
    errorMessage="La razón social es requerida y debe tener entre 2 y 300 caracteres"
  />

  <app-text-input
    [control]="control('rif')"
    label="RIF"
    placeholder="J-12345678-9"
    [errorMessage]="
      control('rif').hasError('duplicateRif')
        ? 'Ya existe un cliente registrado con este RIF'
        : 'El formato del RIF es inválido'
    "
  />

  <app-text-input
    [control]="control('alias')"
    label="Alias"
    placeholder="ACME Corp"
    errorMessage="El alias es requerido (máximo 200 caracteres)"
  />

  <app-select-input
    [control]="control('type')"
    label="Tipo de Cliente"
    placeholder="Seleccione el tipo"
    [options]="customerTypes"
    optionLabel="label"
    optionValue="value"
    errorMessage="El tipo de cliente es requerido"
  />

  <app-select-input
    [control]="paymentTypeControl()"
    label="Condición de Pago"
    placeholder="Seleccione la condición"
    [options]="paymentTypes"
    optionLabel="label"
    optionValue="value"
    errorMessage="La condición de pago es requerida"
  />

  <app-select-input
    [control]="control('priceTypeId')"
    label="Lista de Precio"
    placeholder="Seleccione la lista de precio"
    [options]="priceTypeOptions()"
    optionLabel="label"
    optionValue="value"
    [showClear]="true"
  />

  @if (isCreditPayment()) {
    <app-number-input
      [control]="control('creditDays')"
      label="Días de Crédito"
      [min]="0"
      [max]="365"
      errorMessage="Los días de crédito deben estar entre 0 y 365"
    />

    <app-number-input
      [control]="control('creditLimit')"
      label="Límite de Crédito"
      [min]="0"
      mode="decimal"
      [minFractionDigits]="2"
      [maxFractionDigits]="2"
      errorMessage="El límite de crédito no puede ser negativo"
    />
  }

  @if (isEditMode()) {
    <div
      [formGroup]="form()"
      class="md:col-span-2 flex items-center justify-between p-4 rounded-lg border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-900"
    >
      <div>
        <p class="font-medium text-surface-800 dark:text-surface-200">Cliente Activo</p>
        <p class="text-sm text-surface-500 dark:text-surface-400 mt-0.5">
          Indica si el cliente está activo en el sistema
        </p>
      </div>
      <p-toggleswitch formControlName="active" />
    </div>
  }

  <div
    [formGroup]="form()"
    class="md:col-span-2 rounded-xl p-4 bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 hover:border-surface-300 dark:hover:border-surface-600"
  >
    <label class="block text-sm font-semibold text-surface-700 dark:text-surface-300 mb-2"
      >Notas</label
    >
    <textarea
      pTextarea
      formControlName="notes"
      rows="4"
      placeholder="Observaciones o notas internas sobre el cliente..."
      class="w-full resize-none"
    ></textarea>
  </div>
</app-tab-content>
