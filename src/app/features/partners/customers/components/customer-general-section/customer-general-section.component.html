<app-tab-content [columns]="2">
  <app-text-input
    [control]="control('legalName')"
    [label]="'partners.suppliers.legalName' | translate"
    [placeholder]="'partners.suppliers.acmeCorporationCA' | translate"
    [errorMessage]="'partners.customers.labels.theLegalNameIsRequiredAndMustContain2To300Characters' | translate"
  />

  <app-text-input
    [control]="control('rif')"
    [label]="'partners.customers.labels.taxId' | translate"
    placeholder="J-12345678-9"
    [errorMessage]="
      control('rif').hasError('duplicateRif')
        ? 'Ya existe un cliente registrado con este RIF'
        : 'El formato del RIF es inválido'
    "
  />

  <app-text-input
    [control]="control('alias')"
    [label]="'partners.suppliers.alias' | translate"
    [placeholder]="'partners.suppliers.acmeCorp' | translate"
    [errorMessage]="'partners.customers.labels.anAliasIsRequiredMaximum200Characters' | translate"
  />

  <app-select-input
    [control]="control('type')"
    [label]="'partners.customers.customerType2' | translate"
    [placeholder]="'partners.suppliers.selectTheType' | translate"
    [options]="customerTypes"
    optionLabel="label"
    optionValue="value"
    [errorMessage]="'partners.customers.labels.aCustomerTypeIsRequired' | translate"
  />

  <app-select-input
    [control]="paymentTypeControl()"
    [label]="'partners.customers.paymentTerms' | translate"
    [placeholder]="'partners.customers.selectPaymentTerms' | translate"
    [options]="paymentTypes"
    optionLabel="label"
    optionValue="value"
    [errorMessage]="'partners.customers.labels.aPaymentTermIsRequired' | translate"
  />

  <app-select-input
    [control]="control('priceTypeId')"
    [label]="'partners.customers.priceList' | translate"
    [placeholder]="'partners.customers.selectThePriceList' | translate"
    [options]="priceTypeOptions()"
    optionLabel="label"
    optionValue="value"
    [showClear]="true"
  />

  @if (isCreditPayment()) {
    <app-number-input
      [control]="control('creditDays')"
      [label]="'partners.customers.creditDays' | translate"
      [min]="0"
      [max]="365"
      [errorMessage]="'partners.customers.labels.creditDaysMustBeBetween0And365' | translate"
    />

    <app-number-input
      [control]="control('creditLimit')"
      [label]="'finance.treasury.receivables.creditLimit' | translate"
      [min]="0"
      mode="decimal"
      [minFractionDigits]="2"
      [maxFractionDigits]="2"
      [errorMessage]="'partners.customers.labels.theCreditLimitCannotBeNegative' | translate"
    />
  }

  @if (isEditMode()) {
    <div
      [formGroup]="form()"
      class="md:col-span-2 flex items-center justify-between p-4 rounded-lg border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-900"
    >
      <div>
        <p class="font-medium text-surface-800 dark:text-surface-200">{{ 'partners.customers.activeCustomer' | translate }}</p>
        <p class="text-sm text-surface-500 dark:text-surface-400 mt-0.5">
          {{ 'partners.customers.indicatesWhetherTheCustomerIsActiveInTheSystem' | translate }}
        </p>
      </div>
      <p-toggleswitch formControlName="active" />
    </div>
  }

  <div
    [formGroup]="form()"
    class="md:col-span-2 rounded-xl p-4 bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 hover:border-surface-300 dark:hover:border-surface-600"
  >
    <label class="block text-sm font-semibold text-surface-700 dark:text-surface-300 mb-2"
      >{{ 'finance.billing.invoices.notes' | translate }}</label
    >
    <textarea
      pTextarea
      formControlName="notes"
      rows="4"
      [placeholder]="'partners.customers.internalCustomerCommentsOrNotes' | translate"
      class="w-full resize-none"
    ></textarea>
  </div>
</app-tab-content>
