<div class="p-6 flex flex-col gap-8">
  <app-list-section
    [title]="'partners.suppliers.emailAddresses' | translate"
    icon="pi-envelope"
    [isEmpty]="emailsArray.length === 0"
    emptyIcon="pi-envelope"
    [emptyMessage]="'partners.suppliers.noEmailAddressesRegisteredAddAtLeastOne' | translate"
    addButtonLabel="Agregar Correo"
    (add)="addEmail()"
  >
    @for (email of emailsArray.controls; track $index) {
      <app-list-item
        [control]="emailControl($index)"
        [placeholder]="'partners.customers.labels.emailExampleCom' | translate"
        inputType="email"
        icon="pi-envelope"
        (remove)="removeEmail($index)"
      />
    }
  </app-list-section>

  <app-list-section
    [title]="'partners.suppliers.phoneNumbers' | translate"
    icon="pi-phone"
    [isEmpty]="phonesArray.length === 0"
    emptyIcon="pi-phone"
    [emptyMessage]="'partners.suppliers.noPhoneNumbersRegisteredAddAtLeastOne' | translate"
    addButtonLabel="Agregar Teléfono"
    (add)="addPhone()"
  >
    @for (phone of phonesArray.controls; track $index) {
      <app-list-item
        [control]="phoneControl($index)"
        placeholder="0414-1234567"
        icon="pi-phone"
        (remove)="removePhone($index)"
      />
    }
  </app-list-section>
</div>
