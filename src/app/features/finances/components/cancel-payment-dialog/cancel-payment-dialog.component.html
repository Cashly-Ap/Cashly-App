<p-dialog
  [visible]="visible()"
  [modal]="true"
  [closable]="true"
  [style]="{ width: '28rem', borderRadius: '1rem' }"
  (visibleChange)="!$event && onCancel()"
>
  <ng-template pTemplate="header">
    <div class="flex items-center gap-2">
      <i class="pi pi-exclamation-triangle text-red-500"></i>
      <span class="font-semibold">Cancelar Pago</span>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4">
    <p class="text-sm text-surface-600 dark:text-surface-400">
      ¿Está seguro de que desea cancelar este pago? Esta acción no se puede deshacer.
    </p>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium text-surface-700 dark:text-surface-300">
        Razón de cancelación *
      </label>
      <textarea
        pTextarea
        [ngModel]="form.value.reason"
        (ngModelChange)="form.patchValue({ reason: $event })"
        rows="3"
        class="w-full"
        placeholder="Ingrese la razón de cancelación..."
      ></textarea>
      @if (reasonInvalid) {
        <small class="text-red-500 text-xs flex items-center gap-1">
          <i class="pi pi-exclamation-circle text-xs"></i>
          La razón es requerida
        </small>
      }
      @if (reasonTooLong) {
        <small class="text-red-500 text-xs flex items-center gap-1">
          <i class="pi pi-exclamation-circle text-xs"></i>
          Máximo 500 caracteres
        </small>
      }
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex gap-2 justify-end">
      <p-button
        label="Cancelar"
        [text]="true"
        severity="secondary"
        (onClick)="onCancel()"
      />
      <p-button
        label="Confirmar Cancelación"
        severity="danger"
        (onClick)="onConfirm()"
        [disabled]="form.invalid"
      />
    </div>
  </ng-template>
</p-dialog>
