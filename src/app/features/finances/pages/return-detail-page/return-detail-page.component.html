<app-main-layout>
  <div class="min-h-screen">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 sm:py-6">
      @if (showLoading()) {
        <app-loading-spinner />
      } @else if (returnData(); as ret) {
        <div class="flex flex-col gap-6">
          <app-page-header
            title="Detalles de Devolución"
            subtitle="Información completa de la devolución"
          />

          <app-details-card>
            <app-details-card-header [title]="'Devolución #' + ret.returnNumber" [subtitle]="'Factura #' + ret.invoiceNumber">
              <div actions class="flex gap-3">
                <p-button label="Volver" icon="pi pi-arrow-left" [outlined]="true" (onClick)="goBack()" styleClass="w-full sm:w-auto" />
              </div>
            </app-details-card-header>
            <div class="p-4 sm:p-6">
              <app-details-info-grid>
                <app-details-info-field label="Cliente" [value]="ret.customerName" />
                <app-details-info-field label="RIF" [value]="ret.customerRif" />
                <app-details-info-field label="Tipo" type="badge"><app-text-badge [label]="getReturnTypeLabel(ret.returnType)" [variant]="getReturnTypeVariant(ret.returnType)" /></app-details-info-field>
                <app-details-info-field label="Total" [value]="(ret.totalAmount | number: '1.2-2') ?? ''" />
                <app-details-info-field label="Creado por" [value]="ret.createdByName" />
                <app-details-info-field label="Fecha de creación" [value]="(ret.createdAt | date: 'dd/MM/yyyy HH:mm') || ''" />
                <app-details-info-field label="Última actualización" [value]="(ret.updatedAt | date: 'dd/MM/yyyy HH:mm') || ''" />
              </app-details-info-grid>
              @if (ret.reason) {
                <div class="mt-4 pt-4 border-t border-surface-200 dark:border-surface-700">
                  <p class="text-sm font-semibold text-surface-700 dark:text-surface-300 mb-2">Motivo</p>
                  <div class="p-3 bg-surface-50 dark:bg-surface-900 rounded-lg border border-surface-200 dark:border-surface-700">
                    <p class="text-sm text-surface-600 dark:text-surface-400 whitespace-pre-wrap">{{ ret.reason }}</p>
                  </div>
                </div>
              }
            </div>
          </app-details-card>

          <app-details-card>
            <app-details-card-header title="Líneas de Devolución" />
            <div class="p-4 sm:p-6">
              <div class="overflow-x-auto rounded-xl border border-surface-200 dark:border-surface-700">
                <p-table [value]="ret.lines" styleClass="p-datatable-striped">
                  <ng-template pTemplate="header">
                    <tr>
                      <th class="bg-surface-50 dark:bg-surface-800 w-auto">
                        <div class="font-semibold text-surface-700 dark:text-surface-200">Producto</div>
                      </th>
                      <th class="bg-surface-50 dark:bg-surface-800 w-24 text-right">
                        <div class="font-semibold text-surface-700 dark:text-surface-200">Cantidad</div>
                      </th>
                      <th class="bg-surface-50 dark:bg-surface-800 w-32">
                        <div class="font-semibold text-surface-700 dark:text-surface-200">Almacén</div>
                      </th>
                      <th class="bg-surface-50 dark:bg-surface-800 w-28 text-right">
                        <div class="font-semibold text-surface-700 dark:text-surface-200">Precio Unit.</div>
                      </th>
                      <th class="bg-surface-50 dark:bg-surface-800 w-28 text-right">
                        <div class="font-semibold text-surface-700 dark:text-surface-200">Total</div>
                      </th>
                    </tr>
                  </ng-template>
                  <ng-template pTemplate="body" let-line>
                    <tr class="transition-all duration-200 hover:bg-surface-50 dark:hover:bg-surface-700/30">
                      <td>
                        <span class="font-medium text-surface-900 dark:text-surface-0">{{ line.productName }}</span>
                      </td>
                      <td class="text-right">
                        <span class="text-sm font-medium">{{ line.quantity }}</span>
                      </td>
                      <td>
                        <span class="text-sm text-surface-600 dark:text-surface-400">{{ line.warehouseName }}</span>
                      </td>
                      <td class="text-right">
                        <span class="text-sm">{{ line.unitPrice | number: '1.2-2' }}</span>
                      </td>
                      <td class="text-right">
                        <span class="text-sm font-medium">{{ line.lineTotal | number: '1.2-2' }}</span>
                      </td>
                    </tr>
                  </ng-template>
                </p-table>
              </div>
            </div>
          </app-details-card>
        </div>
      }
    </div>
  </div>
</app-main-layout>
