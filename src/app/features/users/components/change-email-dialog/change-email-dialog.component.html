<p-dialog
  header="Cambiar Correo Electrónico"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  styleClass="w-full max-w-md"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5 pt-2">

    <app-text-input
      label="Nuevo Correo Electrónico"
      placeholder="usuario@correo.com"
      [control]="emailControl"
      [errorMessage]="getEmailError()"
    />

    <app-text-input
      label="Confirmar Correo Electrónico"
      placeholder="usuario@correo.com"
      [control]="confirmEmailControl"
      [errorMessage]="getConfirmEmailError()"
    />

  </form>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-3">
      <p-button
        label="Cancelar"
        [outlined]="true"
        (onClick)="onCancel()"
        [disabled]="loading()"
      />
      <p-button
        label="Guardar"
        icon="pi pi-check"
        severity="contrast"
        (onClick)="onSubmit()"
        [loading]="loading()"
        [disabled]="form.invalid"
      />
    </div>
  </ng-template>
</p-dialog>
