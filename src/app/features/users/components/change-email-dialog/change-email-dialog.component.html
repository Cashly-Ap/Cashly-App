<p-dialog
  header="Cambiar Correo Electrónico"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  styleClass="w-full max-w-md"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5 pt-2">

    <div class="flex flex-col gap-2">
      <label class="font-semibold text-surface-700 dark:text-surface-300">
        Nuevo Correo Electrónico
      </label>
      <input
        pInputText
        type="email"
        formControlName="email"
        placeholder="usuario@correo.com"
        class="w-full bg-surface-0 dark:bg-surface-900 text-surface-900 dark:text-surface-0 border-surface-300 dark:border-surface-600"
        [ngClass]="{
          'ng-invalid ng-dirty': form.get('email')?.invalid && form.get('email')?.touched,
        }"
      />
      @if (form.get('email')?.invalid && form.get('email')?.touched) {
        <small class="text-red-500 dark:text-red-400">{{ getEmailError() }}</small>
      }
    </div>

  </form>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-3">
      <p-button
        label="Cancelar"
        [outlined]="true"
        (onClick)="onCancel()"
        [disabled]="loading()"
      />
      <p-button
        label="Guardar"
        icon="pi pi-check"
        severity="contrast"
        (onClick)="onSubmit()"
        [loading]="loading()"
        [disabled]="form.invalid"
      />
    </div>
  </ng-template>
</p-dialog>
