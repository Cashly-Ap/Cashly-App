<app-main-layout>
  <div class="min-h-screen">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 sm:py-6">
      @if (loading()) {
        <app-loading-spinner />
      }
      @if (user(); as currentUser) {
        <div class="flex flex-col gap-6">
          <app-page-header
            title="Detalles del Usuario"
            subtitle="Información completa del usuario"
          />
          <app-details-card>
            <app-details-card-header [title]="currentUser.userName" [subtitle]="currentUser.email">
              <div actions class="flex gap-3">
                <p-button
                  label="Volver"
                  icon="pi pi-arrow-left"
                  [outlined]="true"
                  (onClick)="onBack()"
                  styleClass="w-full sm:w-auto"
                />
                <p-button
                  label="Editar"
                  icon="pi pi-pencil"
                  severity="contrast"
                  (onClick)="onEdit()"
                  styleClass="w-full sm:w-auto"
                />
              </div>
            </app-details-card-header>
            <div class="p-4 sm:p-6">
              <app-details-info-grid>
                <app-details-info-field
                  label="Email"
                  [value]="currentUser.email"
                />
                <app-details-info-field
                  label="Usuario"
                  [value]="currentUser.userName"
                />
                <app-details-info-field
                  label="Estado"
                  [value]="currentUser.active ? 'Activo' : 'Inactivo'"
                />
                <app-details-info-field
                  label="Rol"
                  [value]="getTypeLabel(currentUser.role)"
                />
                <app-details-info-field
                  label="Email Verificado"
                  [value]="currentUser.emailVerified ? 'Verificado' : 'No verificado'"
                />
                <app-details-info-field
                  label="Fecha de Creación"
                  [value]="(currentUser.createdAt | date: 'dd/MM/yyyy HH:mm') || ''"
                />
                <app-details-info-field
                  label="Última Actualización"
                  [value]="(currentUser.updatedAt | date: 'dd/MM/yyyy HH:mm') || ''"
                />
              </app-details-info-grid>
            </div>
          </app-details-card>
        </div>
      }
    </div>
  </div>
</app-main-layout>
