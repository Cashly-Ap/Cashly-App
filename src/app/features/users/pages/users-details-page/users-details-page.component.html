<app-main-layout>
  <div class="min-h-screen">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 sm:py-6">
      @if (loading()) {
        <app-loading-spinner />
      }
      @if (user(); as currentUser) {
        <div class="flex flex-col gap-6">
          <app-page-header
            title="Detalles del Usuario"
            subtitle="Información completa del usuario"
          />
          <app-details-card>
            <app-details-card-header [title]="currentUser.userName" [subtitle]="currentUser.email">
              <div actions class="flex flex-wrap gap-3">
                <p-button
                  label="Volver"
                  icon="pi pi-arrow-left"
                  [outlined]="true"
                  (onClick)="onBack()"
                  styleClass="w-full sm:w-auto"
                />
                <p-button
                  label="Cambiar Contraseña"
                  icon="pi pi-lock"
                  [outlined]="true"
                  (onClick)="showChangePasswordDialog.set(true)"
                  styleClass="w-full sm:w-auto"
                />
                <p-button
                  label="Cambiar Correo"
                  icon="pi pi-envelope"
                  [outlined]="true"
                  (onClick)="showChangeEmailDialog.set(true)"
                  styleClass="w-full sm:w-auto"
                />
                <p-button
                  label="Editar"
                  icon="pi pi-pencil"
                  severity="contrast"
                  (onClick)="onEdit()"
                  styleClass="w-full sm:w-auto"
                />
              </div>
            </app-details-card-header>
            <div class="p-4 sm:p-6">
              <app-details-info-grid>
                <app-details-info-field
                  label="Email"
                  [value]="currentUser.email"
                />
                <app-details-info-field
                  label="Usuario"
                  [value]="currentUser.userName"
                />
                <app-details-info-field
                  label="Estado"
                  [value]="currentUser.active ? 'Activo' : 'Inactivo'"
                />
                <app-details-info-field
                  label="Rol"
                  [value]="getTypeLabel(currentUser.role)"
                />
                <app-details-info-field
                  label="Email Verificado"
                  [value]="currentUser.emailVerified ? 'Verificado' : 'No verificado'"
                />
                <app-details-info-field
                  label="Fecha de Creación"
                  [value]="(currentUser.createdAt | date: 'dd/MM/yyyy HH:mm') || ''"
                />
                <app-details-info-field
                  label="Última Actualización"
                  [value]="(currentUser.updatedAt | date: 'dd/MM/yyyy HH:mm') || ''"
                />
              </app-details-info-grid>
            </div>
          </app-details-card>

          @if (authService.isSuperAdmin()) {
            <app-details-card>
              <app-details-card-header
                title="Permisos de Módulos"
                subtitle="Selecciona los módulos a los que este usuario tendrá acceso"
              />
              <div class="p-4 sm:p-6 flex flex-col gap-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  @for (module of allModules; track module) {
                    <label class="flex items-center gap-3 cursor-pointer p-3 rounded-lg border border-surface-200 dark:border-surface-700 hover:bg-surface-50 dark:hover:bg-surface-800 transition-colors">
                      <p-checkbox
                        [binary]="true"
                        [ngModel]="moduleSelectionMap().get(module)"
                        (ngModelChange)="toggleModule(module)"
                      />
                      <span class="text-sm font-medium dark:text-surface-100">{{ moduleLabels[module] }}</span>
                    </label>
                  }
                </div>
                <div class="flex justify-end">
                  <button
                    pButton
                    label="Guardar permisos"
                    icon="pi pi-save"
                    severity="contrast"
                    [loading]="savingPermissions()"
                    [disabled]="hasNoPermissionsSelected()"
                    (click)="onSavePermissions()"
                  ></button>
                </div>
              </div>
            </app-details-card>
          }
        </div>
      }
    </div>
  </div>
</app-main-layout>

@if (user(); as currentUser) {
  <app-change-password-dialog
    [userId]="currentUser.id"
    [visible]="showChangePasswordDialog()"
    (visibleChange)="showChangePasswordDialog.set($event)"
  />
  <app-change-email-dialog
    [userId]="currentUser.id"
    [visible]="showChangeEmailDialog()"
    (visibleChange)="showChangeEmailDialog.set($event)"
    (changed)="onEmailChanged($event)"
  />
}
