<app-main-layout>
  <app-form-container>
    <app-form-header [title]="title()" [subtitle]="subtitle()" />
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-form-card>
        <div class="p-4 md:p-6 flex flex-col gap-6">

          @if (!isEditMode()) {
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <app-text-input
                label="Correo Electrónico"
                placeholder="usuario@correo.com"
                [control]="emailControl"
                [errorMessage]="getEmailError()"
              />
              <app-text-input
                label="Contraseña"
                placeholder="••••••••"
                variant="password"
                [control]="passwordControl"
                [errorMessage]="getPasswordError()"
              />
            </div>
          }

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <app-text-input
              label="Nombre de Usuario"
              placeholder="Nombre completo"
              [control]="userNameControl"
              [errorMessage]="getUserNameError()"
            />

            <app-select-input
              label="Rol de Usuario"
              placeholder="Seleccione un rol"
              [options]="userTypes"
              [control]="roleControl"
              errorMessage="El rol de usuario es requerido"
            />
          </div>

          @if (isEditMode()) {
            <app-checkbox-input
              label="Usuario Activo"
              [control]="activeControl"
            />
          }

          @if (isEditMode()) {
            <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t border-surface-200 dark:border-surface-700">
              <p-button
                label="Cambiar Contraseña"
                icon="pi pi-lock"
                [outlined]="true"
                styleClass="w-full sm:w-auto"
                (onClick)="showChangePasswordDialog.set(true)"
              />
              <p-button
                label="Cambiar Correo"
                icon="pi pi-envelope"
                [outlined]="true"
                styleClass="w-full sm:w-auto"
                (onClick)="showChangeEmailDialog.set(true)"
              />
            </div>
          }

        </div>
        <app-form-actions
          [submitLabel]="submitLabel()"
          cancelLabel="Cancelar"
          [loading]="loading()"
          [disabled]="form.invalid"
          (cancel)="onCancel()"
        />
      </app-form-card>
    </form>
  </app-form-container>
</app-main-layout>

@if (isEditMode() && entityId()) {
  <app-change-password-dialog
    [userId]="entityId()!"
    [visible]="showChangePasswordDialog()"
    (visibleChange)="showChangePasswordDialog.set($event)"
  />
  <app-change-email-dialog
    [userId]="entityId()!"
    [visible]="showChangeEmailDialog()"
    (visibleChange)="showChangeEmailDialog.set($event)"
    (changed)="onEmailChanged($event)"
  />
}
