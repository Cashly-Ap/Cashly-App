<p-dialog
  header="Reporte de Facturas - PDF"
  [modal]="true"
  [visible]="visible()"
  (visibleChange)="onHide()"
  [style]="{ width: '500px' }"
  [draggable]="false"
  [resizable]="false"
>
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label for="mode" class="text-sm font-medium">Modo de Reporte</label>
      <p-select
        id="mode"
        [options]="modeOptions"
        [(ngModel)]="mode"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        appendTo="body"
      />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-2">
        <label for="dateFrom" class="text-sm font-medium">Desde</label>
        <p-datepicker
          id="dateFrom"
          [(ngModel)]="dateFrom"
          dateFormat="yy-mm-dd"
          placeholder="Fecha inicial"
          styleClass="w-full"
          appendTo="body"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label for="dateTo" class="text-sm font-medium">Hasta</label>
        <p-datepicker
          id="dateTo"
          [(ngModel)]="dateTo"
          dateFormat="yy-mm-dd"
          placeholder="Fecha final"
          styleClass="w-full"
          appendTo="body"
        />
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <label for="status" class="text-sm font-medium">Estado de la Factura</label>
      <p-select
        id="status"
        [options]="statusOptions"
        [(ngModel)]="status"
        optionLabel="label"
        optionValue="value"
        placeholder="Todos los estados"
        styleClass="w-full"
        appendTo="body"
      />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button
        label="Cancelar"
        [text]="true"
        severity="secondary"
        (onClick)="onHide()"
      />
      <p-button
        label="Generar PDF"
        icon="pi pi-file-pdf"
        (onClick)="generatePdf()"
      />
    </div>
  </ng-template>
</p-dialog>
