<p-dialog
  header="Comprobante de Pago - PDF"
  [modal]="true"
  [visible]="visible()"
  (visibleChange)="onHide()"
  [style]="{ width: '700px' }"
  [draggable]="false"
  [resizable]="false"
>
  <div class="flex flex-col gap-4">
    @if (loading()) {
      <div class="flex justify-center py-8">
        <i class="pi pi-spin pi-spinner text-2xl"></i>
      </div>
    } @else if (pdfUrl()) {
      <iframe [src]="pdfUrl()" class="w-full" style="height: 500px" frameborder="0"></iframe>
    } @else {
      <div class="flex flex-col items-center gap-4 py-8">
        <i class="pi pi-file-pdf text-4xl text-surface-400"></i>
        <p class="text-surface-500">Haga clic en "Generar PDF" para previsualizar el comprobante</p>
      </div>
    }
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Cancelar" [text]="true" severity="secondary" (onClick)="onHide()" />
      @if (pdfUrl()) {
        <p-button
          label="Descargar"
          icon="pi pi-download"
          severity="success"
          (onClick)="downloadPdf()"
        />
      }
      <p-button
        label="Generar PDF"
        icon="pi pi-file-pdf"
        [loading]="loading()"
        (onClick)="generatePdf()"
        [disabled]="loading()"
      />
    </div>
  </ng-template>
</p-dialog>
