<p-dialog
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [style]="{ width: '500px' }"
  header="Stock de Almacenes"
  [draggable]="false"
  [resizable]="false"
>
  <div class="flex flex-col gap-4 pt-2">
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-surface-700 dark:text-surface-300">Almacén</label>
      <p-select
        [options]="warehouseOptions()"
        [(ngModel)]="warehouseId"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        placeholder="Todos los almacenes"
        styleClass="w-full"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-surface-700 dark:text-surface-300">Categoría</label>
      <p-select
        [options]="categoryOptions()"
        [(ngModel)]="categoryId"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        placeholder="Todas las categorías"
        styleClass="w-full"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-surface-700 dark:text-surface-300">Disponibilidad</label>
      <p-select
        [options]="withStockOptions"
        [(ngModel)]="withStock"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        styleClass="w-full"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-surface-700 dark:text-surface-300">Stock Mínimo</label>
      <p-select
        [options]="lowStockOptions"
        [(ngModel)]="lowStock"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex gap-2 justify-end">
      <p-button
        label="Excel"
        icon="pi pi-file-excel"
        (onClick)="generateExcel()"
        severity="success"
        styleClass="p-button-outlined"
      />
      <p-button
        label="Ver PDF"
        icon="pi pi-file-pdf"
        (onClick)="generatePdf()"
        severity="primary"
      />
    </div>
  </ng-template>
</p-dialog>
