<p-dialog
  header="Cambiar Contraseña del Portal"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  styleClass="w-full max-w-md"
>
  <div class="flex flex-col gap-4 py-2">
    <p class="text-sm text-surface-600 dark:text-surface-400">
      Ingresa la nueva contraseña para el acceso al portal de
      <strong>{{ customerName() }}</strong
      >.
    </p>
    <div class="flex flex-col gap-1">
      <label for="customer-new-password" class="text-sm font-medium">Nueva contraseña</label>
      <input
        id="customer-new-password"
        pInputText
        type="password"
        [ngModel]="newPassword()"
        (ngModelChange)="newPassword.set($event)"
        (blur)="passwordTouched.set(true)"
        autocomplete="new-password"
        class="w-full"
        [class.ng-invalid]="passwordTouched() && passwordError()"
        [class.ng-dirty]="passwordTouched()"
      />
      @if (passwordTouched() && passwordError()) {
        <small class="text-xs text-red-500">{{ passwordError() }}</small>
      }
    </div>
    <div class="flex flex-col gap-1">
      <label for="customer-confirm-password" class="text-sm font-medium">
        Confirmar contraseña
      </label>
      <input
        id="customer-confirm-password"
        pInputText
        type="password"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
        (blur)="confirmPasswordTouched.set(true)"
        autocomplete="new-password"
        class="w-full"
        [class.ng-invalid]="confirmPasswordTouched() && confirmPasswordError()"
        [class.ng-dirty]="confirmPasswordTouched()"
      />
      @if (confirmPasswordTouched() && confirmPasswordError()) {
        <small class="text-xs text-red-500">{{ confirmPasswordError() }}</small>
      }
    </div>
  </div>
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Cancelar" [outlined]="true" severity="secondary" (onClick)="close()" />
      <p-button
        label="Guardar"
        severity="contrast"
        [loading]="loading()"
        [disabled]="!isValid()"
        (onClick)="onSubmit()"
      />
    </div>
  </ng-template>
</p-dialog>
