<div
  class="cashly-panel bg-surface-0 dark:bg-surface-900 rounded-3xl border border-surface-200 dark:border-surface-800 overflow-hidden"
>
  <div class="p-6 sm:p-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-6">
      <div class="flex items-center gap-4">
        <i class="pi pi-wallet text-surface-400 dark:text-surface-500 text-3xl"></i>
        <div class="flex flex-col">
          <h3 class="text-xl font-bold text-surface-900 dark:text-surface-50">
            {{ customerName() }}
          </h3>
          @if (customerAlias()) {
            <p class="text-sm text-surface-500 dark:text-surface-400 mt-0.5">
              {{ customerAlias() }}
            </p>
          }
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:text-right">
        <div class="flex flex-col gap-1">
          <p
            class="text-xs text-surface-500 dark:text-surface-400 uppercase tracking-widest font-semibold"
          >
            Saldo pendiente
          </p>
          <p class="text-2xl sm:text-3xl font-extrabold tracking-tight text-red-600">
            {{ pendingBalance() | currency: 'USD' : 'symbol' : '1.2-2' }}
          </p>
        </div>
        <div class="flex flex-col gap-1">
          <p
            class="text-xs text-surface-500 dark:text-surface-400 uppercase tracking-widest font-semibold"
          >
            Saldo a favor
          </p>
          <p class="text-2xl sm:text-3xl font-extrabold tracking-tight text-green-600">
            {{ customerBalance()?.totalBalance ?? 0 | currency: 'USD' : 'symbol' : '1.2-2' }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
