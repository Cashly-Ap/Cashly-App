<p-card>
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div class="flex flex-col">
      <h3 class="text-lg font-semibold text-surface-900 dark:text-surface-100">
        {{ customerName() }}
      </h3>
      @if (customerAlias()) {
        <p class="text-sm text-surface-500 dark:text-surface-400">
          {{ customerAlias() }}
        </p>
      }
    </div>

    <div class="text-left sm:text-right">
      <p class="text-xs text-surface-500 dark:text-surface-400 uppercase tracking-wide font-medium">
        Saldo Total
      </p>
      <p class="text-2xl sm:text-3xl font-bold text-surface-900 dark:text-surface-100">
        {{ (customerBalance()?.totalBalance ?? 0) | currency:'USD':'symbol':'1.2-2' }}
      </p>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end">
      <p-button
        label="Ver Historial"
        icon="pi pi-history"
        severity="contrast"
        [outlined]="true"
        size="small"
      />
    </div>
  </ng-template>
</p-card>
