<div
  class="bg-white dark:bg-surface-900 rounded-xl shadow-2xl border border-surface-100 dark:border-surface-800 overflow-hidden"
>
  <div class="p-6 sm:p-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-6">
      <div class="flex items-center gap-4">
        <i class="pi pi-wallet text-surface-400 dark:text-surface-500 text-3xl"></i>
        <div class="flex flex-col">
          <h3 class="text-xl font-bold text-surface-900 dark:text-surface-50">
            {{ customerName() }}
          </h3>
          @if (customerAlias()) {
            <p class="text-sm text-surface-500 dark:text-surface-400 mt-0.5">
              {{ customerAlias() }}
            </p>
          }
        </div>
      </div>

      <div class="flex flex-col items-start sm:items-end gap-1">
        <p
          class="text-xs text-surface-500 dark:text-surface-400 uppercase tracking-widest font-semibold"
        >
          Saldo Actual
        </p>
        <p
          class="text-3xl sm:text-4xl font-extrabold tracking-tight text-surface-900 dark:text-surface-50"
        >
          {{ customerBalance()?.totalBalance ?? 0 | currency: 'USD' : 'symbol' : '1.2-2' }}
        </p>
      </div>
    </div>
  </div>
</div>
