<app-main-layout>
  <app-form-container maxWidth="max-w-4xl">
    <app-form-header [title]="title()" [subtitle]="subtitle()" />
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-form-card>
        <p-tabs value="0">
          <p-tablist>
            <p-tab value="0">
              <i class="pi pi-info-circle mr-2"></i>
              General
            </p-tab>
            <p-tab value="1">
              <i class="pi pi-phone mr-2"></i>
              Contacto
            </p-tab>
            <p-tab value="2">
              <i class="pi pi-map-marker mr-2"></i>
              Direcciones
            </p-tab>
          </p-tablist>

          <p-tabpanels>
            <p-tabpanel value="0">
              <app-customer-general-section [form]="form" [isEditMode]="isEditMode()" />
            </p-tabpanel>
            <p-tabpanel value="1">
              <app-customer-contact-section [form]="form" />
            </p-tabpanel>
            <p-tabpanel value="2">
              <app-customer-addresses-section [form]="form" />
            </p-tabpanel>
          </p-tabpanels>
        </p-tabs>

        <app-form-actions
          [submitLabel]="submitLabel()"
          cancelLabel="Cancelar"
          [loading]="loading()"
          [disabled]="form.invalid"
          (cancel)="onCancel()"
        />
      </app-form-card>
    </form>
  </app-form-container>
</app-main-layout>
