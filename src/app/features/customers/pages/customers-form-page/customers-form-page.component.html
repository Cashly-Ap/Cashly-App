<app-main-layout>
  <app-form-container maxWidth="max-w-4xl">
    <app-form-header [title]="title()" [subtitle]="subtitle()" />
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-form-card>
        <p-tabs value="0">
          <p-tablist>
            <p-tab value="0">
              <i class="pi pi-info-circle mr-2"></i>
              General
            </p-tab>
            <p-tab value="1">
              <i class="pi pi-phone mr-2"></i>
              Contacto
            </p-tab>
            <p-tab value="2">
              <i class="pi pi-map-marker mr-2"></i>
              Direcciones
            </p-tab>
            <p-tab value="3">
              <i class="pi pi-globe mr-2"></i>
              Portal
            </p-tab>
          </p-tablist>

          <p-tabpanels>
            <p-tabpanel value="0">
              <app-customer-general-section [form]="form" [isEditMode]="isEditMode()" />
            </p-tabpanel>
            <p-tabpanel value="1">
              <app-customer-contact-section [form]="form" />
            </p-tabpanel>
            <p-tabpanel value="2">
              <app-customer-addresses-section [form]="form" />
            </p-tabpanel>
            <p-tabpanel value="3">
              <div class="p-6 flex flex-col gap-6">
                <div class="flex items-center justify-between p-4 rounded-lg border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-900">
                  <div>
                    <p class="font-medium text-surface-800 dark:text-surface-200">Acceso al Portal</p>
                    <p class="text-sm text-surface-500 dark:text-surface-400 mt-0.5">Permite al cliente acceder al portal de clientes</p>
                  </div>
                  <p-toggleswitch formControlName="portalAccess" />
                </div>
                @if (form.get('portalAccess')?.value) {
                  <div class="flex flex-col gap-1">
                    <label class="text-sm font-medium text-surface-700 dark:text-surface-300">
                      Email del Portal
                    </label>
                    <input
                      pInputText
                      formControlName="portalEmail"
                      placeholder="correo@empresa.com"
                      class="w-full"
                    />
                    <small class="text-surface-400 text-xs">Email que el cliente usará para iniciar sesión en el portal</small>
                  </div>
                }
              </div>
            </p-tabpanel>
          </p-tabpanels>
        </p-tabs>

        <app-form-actions
          [submitLabel]="submitLabel()"
          cancelLabel="Cancelar"
          [loading]="loading()"
          [disabled]="form.invalid"
          (cancel)="onCancel()"
        />
      </app-form-card>
    </form>
  </app-form-container>
</app-main-layout>
