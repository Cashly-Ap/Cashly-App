<div class="p-6">
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-lg font-semibold">Componentes del Producto</h3>
    <p-button
      label="Agregar Componente"
      icon="pi pi-plus"
      severity="secondary"
      [outlined]="true"
      (onClick)="onAddComponent()"
    />
  </div>

  @if (componentsArray().length > 0) {
    <div class="overflow-x-auto">
      <p-table [value]="componentsArray().controls" styleClass="p-datatable-sm">
        <ng-template pTemplate="header">
          <tr>
            <th class="w-12">#</th>
            <th>Producto Componente</th>
            <th>Cantidad Requerida</th>
            <th class="w-24 text-center">Acciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-control let-index="rowIndex">
          <tr>
            <td class="font-mono text-sm">{{ index + 1 }}</td>
            <td>
              <p-select
                [formControl]="getControl(index, 'componentProductId')"
                [options]="getAvailableProductOptions(index)"
                optionLabel="label"
                optionValue="id"
                placeholder="Seleccionar producto"
                [filter]="true"
                filterPlaceholder="Buscar producto..."
                appendTo="body"
                styleClass="w-full"
              />
            </td>
            <td>
              <p-inputNumber
                [formControl]="getControl(index, 'quantity')"
                [minFractionDigits]="0"
                [maxFractionDigits]="3"
                [min]="0.001"
                placeholder="0"
                fluid
              />
            </td>
            <td class="text-center">
              <p-button
                icon="pi pi-trash"
                severity="danger"
                [rounded]="true"
                [text]="true"
                pTooltip="Eliminar componente"
                (onClick)="onRemoveComponent(index)"
              />
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  } @else {
    <app-empty-state
      icon="pi-sitemap"
      title="Sin componentes"
      message="Agrega los productos que componen este artículo"
      buttonLabel="Agregar Primer Componente"
      (buttonClick)="onAddComponent()"
    />
  }
</div>
