<div class="flex flex-col gap-3">
  <div class="flex items-center justify-between">
    <span class="font-semibold text-sm">Precios por tipo</span>
    <div class="flex gap-2">
      <p-button
        label="Calcular todos"
        (onClick)="calculateAll()"
        [outlined]="true"
        size="small"
      />
      <p-button
        [icon]="collapsed() ? 'pi pi-chevron-down' : 'pi pi-chevron-up'"
        (onClick)="toggleCollapsed()"
        [text]="true"
        size="small"
      />
    </div>
  </div>

  @if (!collapsed()) {
    <div class="flex flex-col gap-2">
      @for (control of pricesArray.controls; track $index) {
        <div class="flex items-center gap-3 p-3 rounded-lg border border-surface-200 dark:border-surface-700 bg-surface-50 dark:bg-surface-900">
          <span class="text-sm font-medium text-surface-700 dark:text-surface-300 min-w-32">
            {{ getPriceTypeName($index) }}
          </span>
          <p-inputnumber
            [formControl]="getPriceControl($index)"
            mode="currency"
            currency="USD"
            locale="es-VE"
            [minFractionDigits]="2"
            [maxFractionDigits]="2"
            [min]="0"
            styleClass="w-full"
          />
        </div>
      } @empty {
        <p class="text-sm text-surface-400 dark:text-surface-500 text-center py-4">
          No hay tipos de precio configurados
        </p>
      }
    </div>
  }
</div>
