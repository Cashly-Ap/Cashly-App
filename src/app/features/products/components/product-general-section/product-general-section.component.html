<app-tab-content>
  <div class="md:col-span-2">
    <app-file-input
      [control]="photoControl"
      label="Foto del Producto"
      accept="image/*"
      [previewUrl]="existingPhotoUrl()"
      helpText="Formatos aceptados: JPG, PNG, WEBP (máx. 5MB)"
      (deleteExistingPhoto)="deletePhoto.emit()"
    />
  </div>

  <app-text-input
    label="Nombre"
    placeholder="Nombre del producto"
    errorMessage="El nombre es requerido"
    containerClass="md:col-span-2"
    [control]="asFormControl('name')"
  />

  <app-select-input
    label="Categoría"
    icon="pi-tags"
    placeholder="Seleccionar categoría"
    errorMessage="La categoría es requerida"
    [options]="categoryOptions()"
    [control]="asFormControl('categoryId')"
  />

  <app-select-input
    label="Tipo de Producto"
    icon="pi-box"
    placeholder="Seleccionar tipo"
    [options]="productTypeOptions"
    [control]="asFormControl('composite')"
  />

  <app-number-input
    label="Precio Base"
    icon="pi-dollar"
    placeholder="0.00"
    prefix="$"
    [minFractionDigits]="2"
    [maxFractionDigits]="2"
    [control]="asFormControl('basePrice')"
  />

  <app-number-input
    label="Precio de Compra"
    icon="pi-dollar"
    placeholder="0.00"
    prefix="$"
    [minFractionDigits]="2"
    [maxFractionDigits]="2"
    [control]="asFormControl('purchasePrice')"
  />

  <app-number-input
    label="Margen de Ganancia (%)"
    icon="pi-percentage"
    placeholder="0"
    [min]="0"
    [max]="100"
    [minFractionDigits]="0"
    [maxFractionDigits]="2"
    suffix=" %"
    [control]="asFormControl('profitMargin')"
  />

  <div class="md:col-span-2 rounded-xl p-4 bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700">
    <label class="block text-sm font-semibold text-surface-700 dark:text-surface-300 mb-2">Descripción</label>
    <textarea
      pTextarea
      [formControl]="asFormControl('description')"
      placeholder="Descripción opcional del producto"
      rows="3"
      class="w-full"
    ></textarea>
  </div>

  <div class="md:col-span-2 flex items-center justify-between p-4 rounded-lg border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-900">
    <div>
      <p class="font-medium text-surface-800 dark:text-surface-200">Producto Activo</p>
      <p class="text-sm text-surface-500 dark:text-surface-400 mt-0.5">Permite que este producto esté disponible para su uso en el sistema</p>
    </div>
    <p-toggleswitch [formControl]="asFormControl('active')" />
  </div>
</app-tab-content>
