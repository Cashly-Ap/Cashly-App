<app-main-layout>
  <div class="min-h-screen">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 sm:py-6">
      @if (loading()) {
        <app-loading-spinner />
      }
      @if (category(); as currentCategory) {
        <div class="flex flex-col gap-6">
          <app-page-header title="Detalles de Categoría" subtitle="Información completa de la categoría" />

          <app-details-card>
            <app-details-card-header [title]="currentCategory.name">
              <div actions class="flex gap-3">
                <p-button label="Volver" icon="pi pi-arrow-left" [outlined]="true" (onClick)="onBack()" />
                <p-button
                  [label]="currentCategory.active ? 'Desactivar' : 'Activar'"
                  [icon]="currentCategory.active ? 'pi pi-ban' : 'pi pi-check-circle'"
                  [outlined]="true"
                  severity="secondary"
                  (onClick)="onToggleActive()"
                />
                <p-button label="Editar" icon="pi pi-pencil" severity="contrast" (onClick)="onEdit()" />
              </div>
            </app-details-card-header>
            <div class="p-4 sm:p-6">
              <app-details-info-grid>
                <app-details-info-field label="Nombre" [value]="currentCategory.name" />
                <app-details-info-field label="Productos" [value]="currentCategory.productCount.toString()" />
                <app-details-info-field
                  label="Estado"
                  [value]="currentCategory.active ? 'Activa' : 'Inactiva'"
                />
                <app-details-info-field
                  label="Creada"
                  [value]="(currentCategory.createdAt | date: 'dd/MM/yyyy HH:mm') || ''"
                />
                <app-details-info-field
                  label="Actualizada"
                  [value]="(currentCategory.updatedAt | date: 'dd/MM/yyyy HH:mm') || ''"
                />
                <app-details-info-field class="col-span-full" label="Descripción" [value]="currentCategory.description || '—'" />
              </app-details-info-grid>
            </div>
          </app-details-card>
        </div>
      }
    </div>
  </div>
</app-main-layout>
