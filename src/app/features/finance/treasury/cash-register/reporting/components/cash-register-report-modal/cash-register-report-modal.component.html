<p-dialog
  [header]="'finance.treasury.cashregister.cashRegisterReports' | translate"
  [modal]="true"
  [visible]="visible()"
  (visibleChange)="onHide()"
  [style]="{ width: 'min(720px, calc(100vw - 2rem))' }"
  [draggable]="false"
  [resizable]="false"
  (onShow)="loadFilters()"
>
  @if (loading()) {
    <div class="flex justify-center py-12">
      <p-progressSpinner strokeWidth="4" styleClass="h-10 w-10" />
    </div>
  } @else {
    <div class="flex flex-col gap-5 pt-2">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{
          'finance.treasury.cashregister.format' | translate
        }}</label>
        <p-selectButton
          [options]="formatOptions"
          [ngModel]="format()"
          (ngModelChange)="format.set($event)"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full"
        />
      </div>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div class="flex flex-col gap-1 sm:col-span-2">
          <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{
            'finance.treasury.cashregister.reportType' | translate
          }}</label>
          <p-selectButton
            [options]="typeOptions"
            [ngModel]="reportType()"
            (ngModelChange)="reportType.set($event)"
            optionLabel="label"
            optionValue="value"
            styleClass="w-full"
          />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{
            'finance.billing.invoices.startDate2' | translate
          }}</label>
          <p-datepicker
            [(ngModel)]="dateFrom"
            [dateFormat]="locale() === 'en-US' ? 'mm/dd/yy' : 'dd/mm/yy'"
            [placeholder]="'finance.treasury.cashregister.selectStartDate' | translate"
            styleClass="w-full"
            appendTo="body"
          />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{
            'finance.billing.invoices.endDate2' | translate
          }}</label>
          <p-datepicker
            [(ngModel)]="dateTo"
            [dateFormat]="locale() === 'en-US' ? 'mm/dd/yy' : 'dd/mm/yy'"
            [placeholder]="'finance.treasury.cashregister.selectEndDate' | translate"
            styleClass="w-full"
            appendTo="body"
          />
        </div>
      </div>
      <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
        <div class="flex flex-col gap-2">
          <label for="cash-report-customer" class="text-sm font-medium">{{
            'shared.customer' | translate
          }}</label>
          <p-select
            id="cash-report-customer"
            [options]="customerOptions() | translateOptions: true"
            [(ngModel)]="customerId"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            [filterPlaceholder]="'partners.customers.searchCustomers' | translate"
            styleClass="w-full"
            appendTo="body"
          />
        </div>
        <div class="flex flex-col gap-2">
          <label for="cash-report-product" class="text-sm font-medium">{{
            'finance.billing.returns.product' | translate
          }}</label>
          <p-select
            id="cash-report-product"
            [options]="productOptions() | translateOptions: true"
            [(ngModel)]="productId"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            [filterPlaceholder]="'finance.billing.invoices.searchProducts' | translate"
            styleClass="w-full"
            appendTo="body"
          />
        </div>
        <div class="flex flex-col gap-2">
          <label for="cash-report-category" class="text-sm font-medium">{{
            'finance.billing.invoices.category' | translate
          }}</label>
          <p-select
            id="cash-report-category"
            [options]="categoryOptions() | translateOptions: true"
            [(ngModel)]="categoryId"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            [filterPlaceholder]="'finance.billing.invoices.searchCategories' | translate"
            styleClass="w-full"
            appendTo="body"
          />
        </div>
      </div>
      @if (invalidDateRange()) {
        <small class="text-red-600 dark:text-red-400">
          {{ 'finance.treasury.cashregister.theStartDateCannotBeLaterThanTheEndDate' | translate }}
        </small>
      }
    </div>
  }

  <ng-template pTemplate="footer">
    <div class="flex gap-2 justify-end">
      <app-cancel-button icon="" [text]="true" [outlined]="false" (cancelled)="onHide()" />
      <p-button
        [label]="
          format() === 'PDF'
            ? ('finance.billing.invoices.generatePdf' | translate)
            : 'Exportar Excel'
        "
        [icon]="format() === 'PDF' ? 'pi pi-file-pdf' : 'pi pi-file-excel'"
        (onClick)="generateReport()"
        [disabled]="!dateFrom() || !dateTo() || invalidDateRange()"
        severity="contrast"
      />
    </div>
  </ng-template>
</p-dialog>
