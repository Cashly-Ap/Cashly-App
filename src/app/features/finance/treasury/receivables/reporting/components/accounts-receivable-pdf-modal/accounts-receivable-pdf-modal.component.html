<p-dialog
  [header]="'finance.treasury.receivables.accountsReceivablePdf' | translate"
  [modal]="true"
  [visible]="visible()"
  (visibleChange)="onHide()"
  (onShow)="loadCustomers()"
  [style]="{ width: '450px' }"
  [draggable]="false"
  [resizable]="false"
>
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label for="customer" class="text-sm font-medium">{{ 'shared.customer' | translate }}</label>
      <p-select
        id="customer"
        [options]="customerOptions() | translateOptions: true"
        [(ngModel)]="customerId"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'finance.treasury.cashregister.allCustomers' | translate"
        [filter]="true"
        [filterPlaceholder]="'partners.customers.searchCustomers' | translate"
        styleClass="w-full"
        appendTo="body"
      />
    </div>

    <div class="flex items-center gap-2">
      <p-checkbox
        id="overdueOnly"
        [(ngModel)]="overdueOnly"
        [binary]="true"
        inputId="overdueOnly"
      />
      <label for="overdueOnly" class="text-sm font-medium cursor-pointer">
        {{ 'finance.treasury.receivables.overdueOnly' | translate }}
      </label>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button
        appShortcut="cancel"
        [label]="'shared.cancel' | translate"
        [text]="true"
        severity="secondary"
        (onClick)="onHide()"
      />
      <p-button
        [appPermissionModule]="'FINANCES'"
        [appPermission]="'EXPORT'"
        [label]="'finance.billing.invoices.generatePdf' | translate"
        icon="pi pi-file-pdf"
        (onClick)="generatePdf()"
      />
    </div>
  </ng-template>
</p-dialog>
