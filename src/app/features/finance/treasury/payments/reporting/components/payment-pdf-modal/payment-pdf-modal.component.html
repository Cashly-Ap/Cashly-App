<app-report-pdf-modal
  titleKey="finance.treasury.payments.paymentReceiptPdf"
  width="700px"
  [visible]="visible()"
  (visibleChange)="onHide()"
>
  <div class="flex flex-col gap-4">
    @if (loading()) {
      <div class="flex justify-center py-8">
        <i class="pi pi-spin pi-spinner text-2xl"></i>
      </div>
    } @else if (pdfUrl()) {
      <iframe [src]="pdfUrl()" class="w-full" style="height: 500px" frameborder="0"></iframe>
    } @else {
      <div class="flex flex-col items-center gap-4 py-8">
        <i class="pi pi-file-pdf text-4xl text-surface-400"></i>
        <p class="text-surface-500">
          {{ 'finance.treasury.payments.clickGeneratePdfToPreviewTheReceipt' | translate }}
        </p>
      </div>
    }
  </div>

  <ng-container reportFooter>
    <div class="flex justify-end gap-2">
      <app-cancel-button icon="" [text]="true" [outlined]="false" (cancelled)="onHide()" />
      @if (pdfUrl()) {
        <p-button
          [appPermissionModule]="'FINANCE_INVOICES'"
          [appPermission]="'EXPORT'"
          [label]="'finance.treasury.payments.download' | translate"
          icon="pi pi-download"
          severity="success"
          (onClick)="downloadPdf()"
        />
      }
      <p-button
        [appPermissionModule]="'FINANCE_INVOICES'"
        [appPermission]="'EXPORT'"
        [label]="'finance.billing.invoices.generatePdf' | translate"
        icon="pi pi-file-pdf"
        [loading]="loading()"
        (onClick)="generatePdf()"
        [disabled]="loading()"
      />
    </div>
  </ng-container>
</app-report-pdf-modal>
