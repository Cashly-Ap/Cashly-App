<div class="min-h-screen">
  <div class="mx-auto max-w-[1800px] px-4 py-6 sm:px-6 sm:py-8 lg:px-8">
    @if (service.loading() && !expense()) {
      <app-loading-spinner />
    }
    @if (expense(); as e) {
      <div class="flex flex-col gap-6">
        <app-page-header
          [title]="'finance.treasury.expenses.expenseDetails' | translate"
          [subtitle]="'finance.treasury.expenses.expenseDetailsSubtitle' | translate"
        />

        <app-panel-card>
          <app-details-card-header
            [title]="e.description"
            [subtitle]="'finance.treasury.expenses.expense' | translate"
          >
            <div actions class="flex flex-wrap gap-3">
              <app-back-button
                labelKey="finance.billing.creditnotes.back"
                styleClass="w-full sm:w-auto"
                (back)="onBack()"
              />
              <app-detail-actions-menu
                #actionsMenu
                auditEntityType="CASH_MOVEMENT"
                [auditEntityId]="e.id"
                [auditLabel]="e.description"
                [auditSubtitle]="e.paymentMethodName"
              >
                @if (canDelete()) {
                  <p-button
                    [appPermissionCode]="ExpensePermission.DELETE"
                    [label]="'finance.treasury.expenses.deleteExpense' | translate"
                    icon="pi pi-trash"
                    severity="danger"
                    [link]="true"
                    styleClass="w-full justify-start text-left text-sm"
                    (onClick)="actionsMenu.hide(); onDelete()"
                  />
                }
                @if (canCancel()) {
                  <p-button
                    [appPermissionCode]="ExpensePermission.CANCEL"
                    [label]="'finance.treasury.expenses.cancelExpense' | translate"
                    icon="pi pi-times-circle"
                    severity="danger"
                    [link]="true"
                    styleClass="w-full justify-start text-left text-sm"
                    (onClick)="actionsMenu.hide(); onCancelExpense()"
                  />
                }
              </app-detail-actions-menu>
            </div>
          </app-details-card-header>

          <div class="p-4 sm:p-6">
            <app-details-info-grid>
              <app-details-info-field
                [label]="'finance.treasury.expenses.amount' | translate"
                [value]="(e.amount | localizedCurrency: 'USD' : 'symbol' : '1.2-2') || ''"
                type="currency"
              />
              <app-details-info-field
                [label]="'finance.treasury.expenses.paymentMethod' | translate"
                [value]="
                  e.paymentMethodName ||
                  ('finance.treasury.cashregister.noPaymentMethod' | translate)
                "
              />
              <app-details-info-field
                [label]="'finance.treasury.expenses.date' | translate"
                [value]="(e.occurredAt | localizedDate: 'dd/MM/yyyy HH:mm') || ''"
              />
              <app-details-info-field
                [label]="'finance.treasury.expenses.recordedBy' | translate"
                [value]="e.createdByName || '—'"
              />
              <app-details-info-field
                [label]="'finance.treasury.expenses.description' | translate"
                [value]="e.description"
                colspan="full"
              />
              <app-details-info-field
                [label]="'finance.treasury.expenses.status' | translate"
                type="tag"
                [tagLabel]="
                  (e.cancelled
                    ? 'finance.treasury.expenses.cancelled'
                    : 'finance.treasury.expenses.active'
                  ) | translate
                "
                [tagSeverity]="e.cancelled ? 'danger' : 'success'"
              />
              <app-details-info-field
                [label]="'finance.treasury.expenses.registerStatus' | translate"
                [value]="
                  (e.registerStatus === 'OPEN'
                    ? 'finance.treasury.expenses.openRegister'
                    : 'finance.treasury.expenses.closedRegister'
                  ) | translate
                "
              />
              @if (e.cancellationReason) {
                <app-details-info-field
                  [label]="'finance.treasury.expenses.cancelledReason' | translate"
                  [value]="e.cancellationReason"
                  colspan="full"
                />
              }
              @if (e.cancelledAt) {
                <app-details-info-field
                  [label]="'finance.treasury.expenses.cancelledAt' | translate"
                  [value]="(e.cancelledAt | localizedDate: 'dd/MM/yyyy HH:mm') || ''"
                />
              }
              @if (e.cancelledByName) {
                <app-details-info-field
                  [label]="'finance.treasury.expenses.cancelledBy' | translate"
                  [value]="e.cancelledByName"
                />
              }
              <app-details-info-field
                [label]="'finance.treasury.expenses.affectsCash' | translate"
                type="tag"
                [tagLabel]="
                  (e.cancelled ? 'finance.treasury.expenses.no' : 'finance.treasury.expenses.yes')
                    | translate
                "
                [tagSeverity]="e.cancelled ? 'secondary' : 'danger'"
              />
              @if (e.registerOpenedAt) {
                <app-details-info-field
                  [label]="'finance.treasury.expenses.registerOpenedAt' | translate"
                  [value]="(e.registerOpenedAt | localizedDate: 'dd/MM/yyyy HH:mm') || ''"
                />
              }
            </app-details-info-grid>
          </div>
        </app-panel-card>
      </div>
    }
  </div>
</div>

<p-confirmDialog styleClass="max-w-md" />

<app-expense-cancel-dialog
  [visible]="cancelDialogVisible()"
  [expense]="expense()"
  (confirmed)="onCancelConfirmed($event)"
  (cancelled)="onCancelDialogClosed()"
/>
