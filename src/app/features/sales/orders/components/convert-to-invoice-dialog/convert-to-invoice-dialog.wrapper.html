@if (details(); as order) {
  <app-convert-order-to-invoice-dialog
    [visible]="true"
    [orderId]="recordId()"
    [orderNumber]="order.orderNumber"
    [customerName]="order.customerAlias"
    [totalAmount]="order.totalAmount"
    [customerId]="order.customerId"
    (confirmed)="convert($event)"
    (cancelled)="close()"
  />
}
