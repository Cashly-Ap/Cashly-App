<div class="min-h-screen">
  <div class="mx-auto max-w-5xl px-4 py-4 sm:px-6 sm:py-6">
    @if (loading()) {
      <app-loading-spinner />
    }
    @if (warehouse(); as currentWarehouse) {
      <div class="flex flex-col gap-6">
        <app-page-header title="Detalles del Almacén" subtitle="Información general del almacén" />

        <app-details-card>
          <app-details-card-header
            [title]="currentWarehouse.name"
            [subtitle]="currentWarehouse.state + ' · ' + currentWarehouse.municipality"
          >
            <div actions class="flex gap-3">
              <p-button
                label="Volver"
                icon="pi pi-arrow-left"
                [outlined]="true"
                (onClick)="onBack()"
              />
              <app-detail-actions-menu #actionsMenu>
                <p-button
                  label="Editar"
                  icon="pi pi-pencil"
                  [link]="true"
                  (onClick)="actionsMenu.hide(); onEdit()"
                  styleClass="w-full justify-start text-left text-sm"
                />
                @if (currentWarehouse.deletable) {
                  <p-button
                    label="Eliminar"
                    icon="pi pi-trash"
                    severity="danger"
                    [link]="true"
                    (onClick)="actionsMenu.hide(); onDelete()"
                    styleClass="w-full justify-start text-left text-sm"
                  />
                }
                <p-button
                  label="Registrar entrada"
                  icon="pi pi-arrow-circle-down"
                  [link]="true"
                  (onClick)="actionsMenu.hide(); onRegisterEntry()"
                  styleClass="w-full justify-start text-left text-sm"
                />
                <p-button
                  label="Registrar salida"
                  icon="pi pi-arrow-circle-up"
                  [link]="true"
                  (onClick)="actionsMenu.hide(); onRegisterExit()"
                  styleClass="w-full justify-start text-left text-sm"
                />
                <p-button
                  label="Ver stock"
                  icon="pi pi-box"
                  [link]="true"
                  (onClick)="actionsMenu.hide(); onViewStock()"
                  styleClass="w-full justify-start text-left text-sm"
                />
                <p-button
                  label="Historial de movimientos"
                  icon="pi pi-history"
                  [link]="true"
                  (onClick)="actionsMenu.hide(); onViewMovements()"
                  styleClass="w-full justify-start text-left text-sm"
                />
              </app-detail-actions-menu>
            </div>
          </app-details-card-header>

          <div class="p-4 sm:p-6">
            <app-details-info-grid>
              <app-details-info-field label="Nombre" [value]="currentWarehouse.name" />
              <app-details-info-field label="Estado" [value]="currentWarehouse.state" />
              <app-details-info-field label="Municipio" [value]="currentWarehouse.municipality" />
              <app-details-info-field label="Dirección" [value]="currentWarehouse.address || '—'" />
              <app-details-info-field label="Estatus" type="badge">
                <app-status-badge [active]="currentWarehouse.active" />
              </app-details-info-field>
              <app-details-info-field
                label="Fecha de Creación"
                [value]="(currentWarehouse.createdAt | date: 'dd/MM/yyyy HH:mm') || ''"
              />
              <app-details-info-field
                label="Última Actualización"
                [value]="(currentWarehouse.updatedAt | date: 'dd/MM/yyyy HH:mm') || ''"
              />
              @if (currentWarehouse.description) {
                <app-details-info-field
                  class="col-span-full"
                  label="Descripción"
                  [value]="currentWarehouse.description"
                />
              }
            </app-details-info-grid>
          </div>
        </app-details-card>
      </div>
    }
  </div>
</div>

<p-confirmDialog styleClass="max-w-md" />

<app-warehouse-stock-operation-dialog
  [warehouseId]="warehouse()?.id ?? null"
  [warehouseName]="warehouse()?.name ?? ''"
  [operation]="selectedOperation()"
  [visible]="operationDialogVisible()"
  (visibleChange)="operationDialogVisible.set($event)"
/>
