<app-form-container>
  <app-form-header [title]="title()" [subtitle]="subtitle()" />
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-panel-card>
      <p-tabs value="0">
        <p-tablist>
          <p-tab value="0" styleClass="text-sm md:text-base">
            <i class="pi pi-box mr-2"></i>
            <span>{{ 'catalog.products.generalInformation' | translate }}</span>
          </p-tab>
          @if (isComposite()) {
            <p-tab value="1" styleClass="text-sm md:text-base">
              <i class="pi pi-sitemap mr-2"></i>
              <span>{{ 'catalog.products.composition' | translate }}</span>
            </p-tab>
          }
        </p-tablist>
        <p-tabpanels>
          <p-tabpanel value="0">
            <app-product-general-section
              [form]="form"
              [mode]="mode()"
              [existingPhotoUrl]="existingPhotoUrl()"
              [productId]="entityId()"
              (deletePhoto)="onDeletePhoto()"
            />
          </p-tabpanel>

          @if (isComposite()) {
            <p-tabpanel value="1">
              <app-product-composition-section
                [componentsArray]="componentsArray"
                [currentProductId]="entityId()"
                (addComponent)="addComponent()"
                (removeComponent)="removeComponent($event)"
              />
            </p-tabpanel>
          }
        </p-tabpanels>
      </p-tabs>

      <app-form-actions
        [submitLabel]="submitLabel()"
        [cancelLabel]="'shared.cancel' | translate"
        [loading]="loading()"
        [disabled]="form.invalid"
        [tooltipMessage]="submitTooltip()"
        (cancel)="onCancel()"
      />
    </app-panel-card>
  </form>
</app-form-container>
