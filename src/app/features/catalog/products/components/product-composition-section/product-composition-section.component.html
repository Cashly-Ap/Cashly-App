<div class="p-6">
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-lg font-semibold">{{ 'catalog.products.productComponents' | translate }}</h3>
    <p-button
      [label]="'catalog.products.addComponent' | translate"
      icon="pi pi-plus"
      severity="secondary"
      [outlined]="true"
      (onClick)="onAddComponent()"
    />
  </div>

  @if (componentsArray().length > 0) {
    <div class="overflow-x-auto">
      <p-table [value]="componentsArray().controls" styleClass="p-datatable-sm">
        <ng-template pTemplate="header">
          <tr>
            <th class="w-12">#</th>
            <th>{{ 'catalog.products.componentProduct' | translate }}</th>
            <th>{{ 'catalog.products.requiredQuantity' | translate }}</th>
            <th class="w-24 text-center">{{ 'shared.actions' | translate }}</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-control let-index="rowIndex">
          <tr>
            <td class="font-mono text-sm">{{ index + 1 }}</td>
            <td>
              <p-select
                [formControl]="getControl(index, 'componentProductId')"
                [options]="getAvailableProductOptions(index)"
                optionLabel="label"
                optionValue="id"
                [placeholder]="'catalog.products.selectProduct' | translate"
                [filter]="true"
                [filterPlaceholder]="'catalog.products.labels.searchProducts' | translate"
                appendTo="body"
                styleClass="w-full"
              />
            </td>
            <td>
              <p-inputNumber
                [locale]="i18nLanguage.locale()"
                [formControl]="getControl(index, 'quantity')"
                [minFractionDigits]="0"
                [maxFractionDigits]="3"
                [min]="0.001"
                placeholder="0"
                fluid
              />
            </td>
            <td class="text-center">
              <p-button
                [appPermission]="'DELETE'"
                icon="pi pi-trash"
                severity="danger"
                [rounded]="true"
                [text]="true"
                [pTooltip]="'catalog.products.removeComponent' | translate"
                (onClick)="onRemoveComponent(index)"
              />
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  } @else {
    <app-empty-state
      icon="pi-sitemap"
      [title]="'catalog.products.noComponents' | translate"
      [message]="'catalog.products.addTheProductsThatMakeUpThisItem' | translate"
      [buttonLabel]="'catalog.products.addFirstComponent' | translate"
      (buttonClick)="onAddComponent()"
    />
  }
</div>
