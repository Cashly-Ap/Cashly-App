<app-tab-content>
  <div class="md:col-span-2">
    <app-file-input
      [control]="photoControl"
      [label]="'catalog.products.productPhoto' | translate"
      accept="image/*"
      [previewUrl]="existingPhotoUrl()"
      [helpText]="'catalog.products.labels.acceptedFormatsJpgPngWebpMax5Mb' | translate"
      (deleteExistingPhoto)="deletePhoto.emit()"
    />
  </div>

  <app-text-input
    [label]="'finance.treasury.paymentmethods.code' | translate"
    [placeholder]="'catalog.products.productCodeOptional' | translate"
    containerClass="md:col-span-2"
    [control]="asFormControl('code')"
  />

  <app-text-input
    [label]="'finance.treasury.paymentmethods.name' | translate"
    [placeholder]="'catalog.products.productName' | translate"
    [errorMessage]="'catalog.products.labels.aNameIsRequired' | translate"
    containerClass="md:col-span-2"
    [control]="asFormControl('name')"
  />

  <app-select-input
    [label]="'finance.billing.invoices.category' | translate"
    icon="pi-tags"
    [placeholder]="'catalog.products.selectCategory' | translate"
    [errorMessage]="'catalog.products.labels.aCategoryIsRequired' | translate"
    [options]="categoryOptions()"
    [control]="asFormControl('categoryId')"
  />

  <app-select-input
    [label]="'catalog.products.productType' | translate"
    icon="pi-box"
    [placeholder]="'catalog.products.selectType' | translate"
    [options]="productTypeOptions"
    [control]="asFormControl('composite')"
  />

  <app-number-input
    [label]="'catalog.products.purchasePrice' | translate"
    icon="pi-dollar"
    placeholder="0.00"
    prefix="$"
    [minFractionDigits]="2"
    [maxFractionDigits]="2"
    [control]="asFormControl('purchasePrice')"
  />

  <div class="md:col-span-2">
    <app-product-prices-section [form]="form()" />
  </div>

  <div
    class="md:col-span-2 rounded-xl p-4 bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-700"
  >
    <label class="block text-sm font-semibold text-surface-700 dark:text-surface-300 mb-2"
      >{{ 'finance.treasury.paymentmethods.description' | translate }}</label
    >
    <textarea
      pTextarea
      [formControl]="asFormControl('description')"
      [placeholder]="'catalog.products.optionalProductDescription' | translate"
      rows="3"
      class="w-full"
    ></textarea>
  </div>

  @if (mode() === 'edit') {
    <div
      class="md:col-span-2 flex items-center justify-between p-4 rounded-lg border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-900"
    >
      <div>
        <p class="font-medium text-surface-800 dark:text-surface-200">{{ 'catalog.products.activeProduct' | translate }}</p>
        <p class="text-sm text-surface-500 dark:text-surface-400 mt-0.5">
          {{ 'catalog.products.makesThisProductAvailableForUseInTheSystem' | translate }}
        </p>
      </div>
      <p-toggleswitch [formControl]="asFormControl('active')" name="active" />
    </div>
  }
</app-tab-content>
