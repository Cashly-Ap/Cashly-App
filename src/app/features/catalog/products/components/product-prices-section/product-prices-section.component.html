<div class="flex flex-col gap-3">
  <div class="flex items-center justify-between">
    <span class="font-semibold text-sm">Precios por tipo</span>
    <div class="flex gap-2">
      <p-button label="Calcular todos" (onClick)="calculateAll()" [outlined]="true" size="small" />
      <p-button
        [icon]="collapsed() ? 'pi pi-chevron-down' : 'pi pi-chevron-up'"
        (onClick)="toggleCollapsed()"
        [text]="true"
        size="small"
      />
    </div>
  </div>

  @if (!collapsed()) {
    <div class="flex flex-col gap-4">
      @for (control of pricesControls(); track $index) {
        <div
          class="flex flex-col gap-1.5 rounded-lg border border-surface-200 dark:border-surface-700 bg-surface-50 dark:bg-surface-900 p-4"
        >
          <span class="text-sm font-semibold text-surface-700 dark:text-surface-300">
            {{ getPriceTypeName($index) }}
          </span>
          <div class="grid grid-cols-[75%_25%] gap-4 mt-1.5">
            <div class="flex flex-col gap-1">
              <label class="text-xs font-medium text-surface-500 dark:text-surface-400"
                >Precio</label
              >
              <p-inputnumber
                [formControl]="getPriceControl($index)"
                mode="decimal"
                prefix="$ "
                [minFractionDigits]="2"
                [maxFractionDigits]="2"
                [min]="0"
                fluid
              />
            </div>
            <div class="flex flex-col gap-1 pr-2">
              <label class="text-xs font-medium text-surface-500 dark:text-surface-400"
                >Margen</label
              >
              <p-inputnumber
                [formControl]="getProfitMarginControl($index)"
                mode="decimal"
                suffix="%"
                [minFractionDigits]="0"
                [maxFractionDigits]="2"
                [min]="0"
                [max]="100"
                styleClass="w-full"
                placeholder="0"
              />
            </div>
          </div>
        </div>
      } @empty {
        <p class="text-sm text-surface-400 dark:text-surface-500 text-center py-4">
          No hay tipos de precio configurados
        </p>
      }
    </div>
  }
</div>
