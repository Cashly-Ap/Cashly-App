<p-dialog
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  (onShow)="loadFilters()"
  [modal]="true"
  [style]="{ width: '500px' }"
  [header]="'catalog.products.productCatalog' | translate"
  [draggable]="false"
  [resizable]="false"
>
  @if (loading()) {
    <div class="flex justify-center py-10">
      <p-progressSpinner strokeWidth="4" styleClass="w-10 h-10" />
    </div>
  } @else {
    <div class="flex flex-col gap-4 pt-2">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ 'catalog.products.search' | translate }}</label>
        <app-search-field
          [value]="search()"
          [placeholder]="'catalog.products.searchProducts' | translate"
          (search)="search.set($event)"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ 'finance.billing.invoices.category' | translate }}</label>
        <p-select
          [options]="categoryOptions() | translateOptions: true"
          [(ngModel)]="categoryId"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          [placeholder]="'finance.billing.invoices.allCategories' | translate"
          styleClass="w-full"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ 'inventory.warehouses.warehouse' | translate }}</label>
        <p-select
          [options]="warehouseOptions() | translateOptions: true"
          [(ngModel)]="warehouseId"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          [placeholder]="'inventory.warehouses.allWarehouses' | translate"
          styleClass="w-full"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300"
          >{{ 'inventory.warehouses.availability' | translate }}</label
        >
        <p-select
          [options]="stockOptions | translateOptions"
          [(ngModel)]="withStock"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          styleClass="w-full"
        />
      </div>
    </div>
  }

  <ng-template pTemplate="footer">
    <p-button
      [appPermissionModule]="'CATALOG_PRODUCTS'"
      [appPermission]="'EXPORT'"
      [label]="'inventory.warehouses.viewPdf' | translate"
      icon="pi pi-file-pdf"
      (onClick)="generatePdf()"
      severity="primary"
    />
  </ng-template>
</p-dialog>
