<app-report-pdf-modal
  titleKey="catalog.products.commercialCatalog"
  width="500px"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  (show)="loadFilters()"
>
  @if (loading()) {
    <div class="flex justify-center py-10">
      <p-progressSpinner strokeWidth="4" styleClass="w-10 h-10" />
    </div>
  } @else {
    <div class="flex flex-col gap-4 pt-2">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{
          'catalog.products.search' | translate
        }}</label>
        <app-search-field
          [value]="search()"
          [placeholder]="'catalog.products.searchProducts' | translate"
          (search)="search.set($event)"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{
          'finance.billing.invoices.category' | translate
        }}</label>
        <p-select
          [options]="categoryOptions() | translateOptions: true"
          [(ngModel)]="categoryId"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          [placeholder]="'finance.billing.invoices.allCategories' | translate"
          styleClass="w-full"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{
          'catalog.products.priceType' | translate
        }}</label>
        <p-select
          [options]="priceTypeOptions() | translateOptions: true"
          [(ngModel)]="priceTypeId"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          [placeholder]="'catalog.products.noPrice' | translate"
          styleClass="w-full"
        />
        <small class="text-surface-500 dark:text-surface-400">
          {{ 'catalog.products.optionalIfNoneIsSelectedTheCatalogWillNotShowPrices' | translate }}
        </small>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{
          'inventory.warehouses.available' | translate
        }}</label>
        <p-select
          [options]="activeOptions | translateOptions"
          [(ngModel)]="active"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          styleClass="w-full"
        />
      </div>
    </div>
  }

  <ng-container reportFooter>
    <p-button
      [appPermissionModule]="'CATALOG_PRODUCTS'"
      [appPermission]="'EXPORT'"
      [label]="'inventory.warehouses.viewPdf' | translate"
      icon="pi pi-file-pdf"
      (onClick)="generatePdf()"
      severity="primary"
    />
  </ng-container>
</app-report-pdf-modal>
