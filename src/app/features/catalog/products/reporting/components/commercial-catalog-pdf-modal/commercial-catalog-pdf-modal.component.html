<p-dialog
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  (onShow)="loadFilters()"
  [modal]="true"
  [style]="{ width: '500px' }"
  [header]="'catalog.products.commercialCatalog' | translate"
  [draggable]="false"
  [resizable]="false"
>
  @if (loading()) {
    <div class="flex justify-center py-10">
      <p-progressSpinner strokeWidth="4" styleClass="w-10 h-10" />
    </div>
  } @else {
    <div class="flex flex-col gap-4 pt-2">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ 'catalog.products.search' | translate }}</label>
        <app-search-field
          [value]="search()"
          [placeholder]="'catalog.products.searchProducts' | translate"
          (search)="search.set($event)"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ 'finance.billing.invoices.category' | translate }}</label>
        <p-select
          [options]="categoryOptions() | translateOptions: true"
          [(ngModel)]="categoryId"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          [placeholder]="'finance.billing.invoices.allCategories' | translate"
          styleClass="w-full"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300"
          >{{ 'catalog.products.priceType' | translate }}</label
        >
        <p-select
          [options]="priceTypeOptions() | translateOptions: true"
          [(ngModel)]="priceTypeId"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          [placeholder]="'catalog.products.noPrice' | translate"
          styleClass="w-full"
        />
        <small class="text-surface-500 dark:text-surface-400">
          {{ 'catalog.products.optionalIfNoneIsSelectedTheCatalogWillNotShowPrices' | translate }}
        </small>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-surface-700 dark:text-surface-300">{{ 'inventory.warehouses.available' | translate }}</label>
        <p-select
          [options]="activeOptions | translateOptions"
          [(ngModel)]="active"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          styleClass="w-full"
        />
      </div>
    </div>
  }

  <ng-template pTemplate="footer">
    <p-button
      [appPermissionModule]="'CATALOG'"
      [appPermission]="'EXPORT'"
      [label]="'inventory.warehouses.viewPdf' | translate"
      icon="pi pi-file-pdf"
      (onClick)="generatePdf()"
      severity="primary"
    />
  </ng-template>
</p-dialog>
