<div class="min-h-screen">
  <div class="max-w-[1800px] mx-auto px-4 sm:px-6 py-4 sm:py-6">
    @if (loading()) {
      <app-loading-spinner />
    }
    @if (priceType(); as currentPriceType) {
      <div class="flex flex-col gap-6">
        <app-page-header
          [title]="'catalog.pricetypes.priceTypeDetails' | translate"
          [subtitle]="'catalog.pricetypes.priceTypeInformation' | translate"
        />

        <app-details-card>
          <app-details-card-header [title]="currentPriceType.name">
            <div actions class="flex gap-3">
              <p-button
                [label]="'finance.billing.creditnotes.back' | translate"
                icon="pi pi-arrow-left"
                [outlined]="true"
                (onClick)="onBack()"
              />
              <app-detail-actions-menu #actionsMenu>
                <p-button
                  [appPermission]="'UPDATE'"
                  [label]="'finance.billing.invoices.edit' | translate"
                  icon="pi pi-pencil"
                  [link]="true"
                  (onClick)="actionsMenu.hide(); onEdit()"
                  styleClass="w-full justify-start text-left text-sm"
                />
              </app-detail-actions-menu>
            </div>
          </app-details-card-header>
          <div class="p-4 sm:p-6">
            <app-details-info-grid>
              <app-details-info-field [label]="'finance.treasury.paymentmethods.name' | translate" [value]="currentPriceType.name" />
              <app-details-info-field [label]="'finance.billing.invoices.status' | translate" type="badge">
                <app-status-badge
                  [active]="currentPriceType.active"
                  activeLabel="Activo"
                  inactiveLabel="Inactivo"
                />
              </app-details-info-field>
            </app-details-info-grid>
          </div>
        </app-details-card>
      </div>
    }
  </div>
</div>
