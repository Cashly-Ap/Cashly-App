<p-dialog
  [visible]="visible()"
  [modal]="true"
  [style]="{ width: '480px' }"
  [closable]="true"
  [dismissableMask]="true"
  (onHide)="onHide()"
>
  <ng-template pTemplate="header">
    <div class="flex items-center gap-3">
      <div class="flex items-center justify-center w-9 h-9 rounded-full bg-red-100 dark:bg-red-950 shrink-0">
        <i class="pi pi-ban text-red-600 dark:text-red-400 text-lg"></i>
      </div>
      <span class="text-base font-semibold text-surface-900 dark:text-surface-0">Cancelar Compra</span>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4">
    @if (purchaseNumber(); as number) {
      <div class="bg-surface-50 dark:bg-surface-800 rounded-lg p-4 text-sm">
        <span class="font-medium">Compra #{{ number }}</span>
        <p class="text-surface-500 mt-1">Se cancelará la compra y se revertirán los movimientos de stock.</p>
      </div>
    }

    <div class="flex flex-col gap-1.5">
      <label for="cancelReason" class="text-sm font-semibold text-surface-700 dark:text-surface-300">
        Motivo de Cancelación *
      </label>
      <input
        id="cancelReason"
        pInputText
        type="text"
        [ngModel]="reason()"
        (ngModelChange)="reason.set($event)"
        placeholder="Ej: Error en datos del proveedor"
        class="w-full"
      />
      @if (!reason() && reason() === '') {
        <small class="text-red-500 text-xs">El motivo es requerido</small>
      }
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="cancelNotes" class="text-sm font-semibold text-surface-700 dark:text-surface-300">
        Notas <span class="text-surface-400 text-xs font-normal ml-1">(opcional)</span>
      </label>
      <textarea
        id="cancelNotes"
        pTextarea
        [ngModel]="notes()"
        (ngModelChange)="notes.set($event)"
        rows="3"
        class="w-full"
        placeholder="Notas adicionales..."
      ></textarea>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex gap-2 justify-end">
      <p-button label="Volver" severity="secondary" [outlined]="true" (onClick)="onCancel()" />
      <p-button
        label="Cancelar Compra"
        icon="pi pi-ban"
        severity="danger"
        [disabled]="!reason()"
        (onClick)="onConfirm()"
      />
    </div>
  </ng-template>
</p-dialog>
