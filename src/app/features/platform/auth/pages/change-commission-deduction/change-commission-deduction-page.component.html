<app-form-container maxWidth="max-w-[1800px]">
  <app-form-header
    [title]="'platform.auth.monthlyLatePaymentDeduction' | translate"
    [subtitle]="
      'platform.auth.percentageDeductedFromCommissionForEachMonthAPaymentIsLate' | translate
    "
  />
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-panel-card>
      <div class="flex flex-col gap-4 p-4 md:p-6 lg:p-8">
        <app-number-input
          [control]="asFormControl(control('commissionDeductionPercentage'))"
          [label]="'platform.auth.monthlyDeduction' | translate"
          placeholder="0"
          [min]="0"
          [max]="100"
          suffix="%"
          [minFractionDigits]="2"
          [maxFractionDigits]="2"
          [errorMessage]="getCommissionDeductionError()"
          [helpText]="
            'platform.auth.percentageDeductedFromTheNominalCommissionForEachMonthTheInvoicePaymentIsOverdue'
              | translate
          "
        />
      </div>
      <app-form-actions
        [submitLabel]="'finance.treasury.receivables.refresh' | translate"
        [cancelLabel]="'shared.cancel' | translate"
        [loading]="authService.loading()"
        [disabled]="form.invalid"
        (cancel)="onCancel()"
      />
    </app-panel-card>
  </form>
</app-form-container>
