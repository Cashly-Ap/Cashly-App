<app-form-container maxWidth="max-w-[1800px]">
  <app-form-header
    [title]="'platform.auth.changePassword' | translate"
    [subtitle]="'platform.auth.updateYourPasswordToKeepYourAccountSecure' | translate"
  />
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-panel-card>
      <div class="flex flex-col gap-4 p-4 md:p-6 lg:p-8">
        <app-text-input
          [control]="asFormControl(control('newPassword'))"
          [label]="'platform.auth.newPassword' | translate"
          [placeholder]="'platform.auth.enterYourNewPassword' | translate"
          variant="password"
          [errorMessage]="getPasswordError()"
        />
        <app-text-input
          [control]="asFormControl(control('confirmPassword'))"
          [label]="'platform.auth.confirmNewPassword' | translate"
          [placeholder]="'platform.auth.confirmYourNewPassword' | translate"
          variant="password"
          [errorMessage]="getConfirmPasswordError()"
        />
      </div>
      <app-form-actions
        [submitLabel]="'finance.treasury.receivables.refresh' | translate"
        [cancelLabel]="'shared.cancel' | translate"
        [loading]="authService.loading()"
        [disabled]="form.invalid"
        (cancel)="onCancel()"
      />
    </app-panel-card>
  </form>
</app-form-container>
