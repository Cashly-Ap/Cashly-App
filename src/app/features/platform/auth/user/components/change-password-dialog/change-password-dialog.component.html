<p-dialog
  [header]="'platform.auth.changePassword' | translate"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  styleClass="w-full max-w-md"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-3 pt-2">
    @if (selfService()) {
      <app-text-input
        [label]="'platform.auth.currentPassword' | translate"
        placeholder="••••••••"
        variant="password"
        [control]="currentPasswordControl"
        [errorMessage]="currentPasswordError()"
      />
    }
    <app-text-input
      [label]="'platform.auth.newPassword' | translate"
      placeholder="••••••••"
      variant="password"
      [control]="passwordControl"
      [errorMessage]="passwordError()"
    />
    <app-text-input
      [label]="'platform.auth.user.confirmPassword' | translate"
      placeholder="••••••••"
      variant="password"
      [control]="confirmPasswordControl"
      [errorMessage]="confirmPasswordError()"
    />
  </form>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-3">
      <app-cancel-button icon="" [disabled]="loading()" (cancelled)="onCancel()" />
      <app-submit-button
        labelKey="finance.billing.creditnotes.save"
        (action)="onSubmit()"
        [loading]="loading()"
        [disabled]="form.invalid"
      />
    </div>
  </ng-template>
</p-dialog>
