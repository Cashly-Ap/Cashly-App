<p-dialog
  [header]="'platform.auth.user.changeEmailAddress' | translate"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  styleClass="w-full max-w-md"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5 pt-2">
    <app-text-input
      [label]="'platform.auth.user.newEmailAddress' | translate"
      [placeholder]="'platform.auth.userExampleComLabel' | translate"
      [control]="emailControl"
      [errorMessage]="getEmailError()"
    />

    <app-text-input
      [label]="'platform.auth.user.confirmEmailAddress' | translate"
      [placeholder]="'platform.auth.userExampleComLabel' | translate"
      [control]="confirmEmailControl"
      [errorMessage]="getConfirmEmailError()"
    />
  </form>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-3">
      <p-button
        appShortcut="cancel"
        [label]="'shared.cancel' | translate"
        [outlined]="true"
        (onClick)="onCancel()"
        [disabled]="loading()"
      />
      <p-button
        appShortcut="submit"
        [label]="'finance.billing.creditnotes.save' | translate"
        icon="pi pi-check"
        severity="contrast"
        (onClick)="onSubmit()"
        [loading]="loading()"
        [disabled]="form.invalid"
      />
    </div>
  </ng-template>
</p-dialog>
