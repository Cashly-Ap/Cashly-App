<app-form-container>
  <app-form-header [title]="title()" [subtitle]="subtitle()" />
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-form-card>
      <p-tabs [value]="activeTab()" (valueChange)="activeTab.set(($event ?? 'general').toString())">
        <p-tablist>
          <p-tab value="general"><i class="pi pi-info-circle mr-2"></i>General</p-tab>
          <p-tab value="contact"><i class="pi pi-address-book mr-2"></i>Contacto y dirección</p-tab>
          <p-tab value="access"><i class="pi pi-shield mr-2"></i>Acceso</p-tab>
        </p-tablist>
        <p-tabpanels>
          <p-tabpanel value="general">
            <app-tab-content
              [columns]="2"
              class="block [&>div>*:last-child:nth-child(2n+1)]:md:col-span-full"
            >
              @if (canManagePhoto()) {
                <app-file-input
                  class="md:col-span-full"
                  label="Foto del usuario"
                  [control]="photo"
                  accept="image/png,image/jpeg"
                  [maxFileSize]="5000000"
                  helpText="PNG o JPG. Máximo 5 MB."
                  [previewUrl]="removePhoto() ? null : photoUrl()"
                  (fileSelected)="removePhoto.set(false)"
                  (deleteExistingPhoto)="removePhoto.set(true)"
                />
              }
              <app-text-input
                label="Nombre"
                placeholder="Nombre del usuario"
                errorMessage="El nombre es requerido (máximo 100 caracteres)"
                [control]="control('firstName')"
              />
              <app-text-input
                label="Apellidos"
                placeholder="Apellidos del usuario"
                errorMessage="Los apellidos son requeridos (máximo 100 caracteres)"
                [control]="control('lastName')"
              />
              <app-text-input
                label="Nombre de usuario"
                placeholder="Nombre de acceso"
                errorMessage="El usuario debe tener entre 3 y 100 caracteres"
                [control]="control('userName')"
              />
              @if (isCreateMode()) {
                <app-text-input
                  label="Correo electrónico"
                  placeholder="usuario@ejemplo.com"
                  errorMessage="Introduce un correo válido"
                  [control]="control('email')"
                />
                <app-text-input
                  class="md:col-span-2"
                  label="Contraseña"
                  errorMessage="Usa al menos 8 caracteres, mayúsculas, minúsculas y números"
                  variant="password"
                  [control]="control('password')"
                />
              }
            </app-tab-content>
          </p-tabpanel>
          <p-tabpanel value="contact">
            <app-tab-content
              [columns]="2"
              class="block [&>div>*:last-child:nth-child(2n+1)]:md:col-span-full"
            >
              <app-text-input
                label="Teléfono"
                placeholder="0414-1234567"
                errorMessage="Introduce entre 7 y 15 dígitos"
                [control]="control('phone')"
              />
              @for (field of addressFields; track field.key) {
                @if (field.key === 'country') {
                  <app-country-input [control]="control(field.key)" />
                } @else {
                  <app-text-input [label]="field.label" [control]="control(field.key)" />
                }
              }
            </app-tab-content>
          </p-tabpanel>
          <p-tabpanel value="access">
            <app-tab-content
              [columns]="2"
              class="block [&>div>*:last-child:nth-child(2n+1)]:md:col-span-full"
            >
              <app-select-input
                label="Rol"
                placeholder="Seleccione un rol"
                [filter]="true"
                [options]="roles()"
                [control]="control('roleId')"
                errorMessage="Seleccione un rol disponible"
              />
              <app-select-input
                label="Departamento"
                placeholder="Seleccione un departamento"
                [filter]="true"
                [options]="departments()"
                [control]="control('departmentId')"
                errorMessage="Seleccione un departamento disponible"
              />
              @if (isEditMode()) {
                <div
                  class="md:col-span-2 flex items-center justify-between p-4 rounded-lg border border-surface-200 dark:border-surface-800 bg-surface-50 dark:bg-surface-900"
                >
                  <div>
                    <p class="font-medium text-surface-800 dark:text-surface-200">Usuario Activo</p>
                    <p class="text-sm text-surface-500 dark:text-surface-400 mt-0.5">
                      Indica si el usuario está activo en el sistema
                    </p>
                  </div>
                  <p-toggleswitch formControlName="active" />
                </div>
              }
            </app-tab-content>
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
      <app-form-actions
        [submitLabel]="submitLabel()"
        cancelLabel="Cancelar"
        [loading]="loading() || savingPhoto()"
        [disabled]="form.invalid"
        tooltipMessage="Complete los campos requeridos"
        (cancel)="onCancel()"
      />
    </app-form-card>
  </form>
</app-form-container>
