<div class="p-6 flex flex-col gap-8">
  <app-list-section
    title="Correos Electrónicos"
    icon="pi-envelope"
    [isEmpty]="emailsArray.length === 0"
    emptyIcon="pi-envelope"
    emptyMessage="No hay correos electrónicos registrados. Agregue al menos uno."
    addButtonLabel="Agregar Correo"
    (add)="addEmail()"
  >
    @for (email of emailsArray.controls; track $index) {
      <app-list-item
        [control]="emailControl($index)"
        placeholder="correo@ejemplo.com"
        inputType="email"
        icon="pi-envelope"
        (remove)="removeEmail($index)"
      />
    }
  </app-list-section>

  <app-list-section
    title="Teléfonos"
    icon="pi-phone"
    [isEmpty]="phonesArray.length === 0"
    emptyIcon="pi-phone"
    emptyMessage="No hay teléfonos registrados. Agregue al menos uno."
    addButtonLabel="Agregar Teléfono"
    (add)="addPhone()"
  >
    @for (phone of phonesArray.controls; track $index) {
      <app-list-item
        [control]="phoneControl($index)"
        placeholder="0414-1234567"
        icon="pi-phone"
        (remove)="removePhone($index)"
      />
    }
  </app-list-section>
</div>
