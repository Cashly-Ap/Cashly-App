<app-main-layout>
  <div class="min-h-screen">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 sm:py-6">
      @if (loading()) {
        <app-loading-spinner />
      }
      @if (priceType(); as currentPriceType) {
        <div class="flex flex-col gap-6">
          <app-page-header title="Detalles de Tipo de Precio" subtitle="Información del tipo de precio" />

          <app-details-card>
            <app-details-card-header [title]="currentPriceType.name">
              <div actions class="flex gap-3">
                <p-button label="Volver" icon="pi pi-arrow-left" [outlined]="true" (onClick)="onBack()" />
                <p-button label="Editar" icon="pi pi-pencil" severity="contrast" (onClick)="onEdit()" />
              </div>
            </app-details-card-header>
            <div class="p-4 sm:p-6">
              <app-details-info-grid>
                <app-details-info-field label="Nombre" [value]="currentPriceType.name" />
                <app-details-info-field label="Estado" type="badge">
                  <app-status-badge [active]="currentPriceType.active" activeLabel="Activo" inactiveLabel="Inactivo" />
                </app-details-info-field>
              </app-details-info-grid>
            </div>
          </app-details-card>
        </div>
      }
    </div>
  </div>
</app-main-layout>
