<app-form-container maxWidth="max-w-2xl">
  <app-form-header
    title="Cambiar Contraseña"
    subtitle="Actualiza tu contraseña para mantener tu cuenta segura"
  />
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-form-card>
      <div class="flex flex-col gap-4 p-4 md:p-6 lg:p-8">
        <app-text-input
          [control]="asFormControl(control('newPassword'))"
          label="Nueva Contraseña"
          placeholder="Ingresa tu nueva contraseña"
          variant="password"
          [errorMessage]="getPasswordError()"
        />
        <app-text-input
          [control]="asFormControl(control('confirmPassword'))"
          label="Confirmar Nueva Contraseña"
          placeholder="Confirma tu nueva contraseña"
          variant="password"
          [errorMessage]="getConfirmPasswordError()"
        />
      </div>
      <app-form-actions
        submitLabel="Actualizar"
        cancelLabel="Cancelar"
        [loading]="authService.loading()"
        [disabled]="form.invalid"
        (cancel)="onCancel()"
      />
    </app-form-card>
  </form>
</app-form-container>
