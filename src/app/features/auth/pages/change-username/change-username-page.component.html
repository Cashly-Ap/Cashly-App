<app-main-layout>
  <app-form-container maxWidth="max-w-2xl">
    <app-form-header
      title="Cambiar Nombre de Usuario"
      subtitle="Actualiza tu nombre de usuario"
    />
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-form-card>
        <div class="flex flex-col gap-4 p-4 md:p-6 lg:p-8">
           <app-text-input
            [control]="asFormControl(control('displayName'))"
            label="Nombre de Usuario"
            placeholder="Ingresa tu nombre de usuario"
            [errorMessage]="getDisplayNameError()"
          />
        </div>
        <app-form-actions
          submitLabel="Actualizar"
          cancelLabel="Cancelar"
          [loading]="authService.loading()"
          [disabled]="form.invalid"
          (cancel)="onCancel()"
        />
      </app-form-card>
    </form>
  </app-form-container>
</app-main-layout>
