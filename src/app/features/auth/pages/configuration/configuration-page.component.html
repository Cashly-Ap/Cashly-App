  <div class="flex justify-center px-4 py-8">
    <div class="w-full max-w-2xl flex flex-col gap-6">
      <h1 class="text-2xl font-bold text-surface-900 dark:text-surface-0">
        Configuración de Cuenta
      </h1>

      @if (currentUser(); as user) {
        <div class="rounded-xl border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 overflow-hidden">
          <div class="flex items-start gap-4 p-6">
            <p-avatar
              [label]="getInitials()"
              size="xlarge"
              [style]="{ 'background-color': '#2196F3', color: '#ffffff', 'font-size': '2rem' }"
              styleClass="shrink-0"
            />
            <div class="flex flex-col gap-1 min-w-0">
              <h2 class="text-xl font-semibold text-surface-900 dark:text-surface-0 truncate">{{ user.userName }}</h2>
              <p class="text-sm text-surface-500 dark:text-surface-400">{{ user.email }}</p>
              <p class="text-xs text-surface-400 dark:text-surface-500">
                Miembro desde {{ user.createdAt | date: 'dd/MM/yyyy' }}
              </p>
              <div class="flex gap-2 mt-2">
                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold"
                  [ngClass]="user.active
                    ? 'bg-green-100 dark:bg-green-900/40 text-green-700 dark:text-green-300'
                    : 'bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300'">
                  {{ user.active ? 'Activo' : 'Inactivo' }}
                </span>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300">
                  {{ getUserTypeLabel(user.type) }}
                </span>
              </div>
            </div>
          </div>

          <div class="border-t border-surface-100 dark:border-surface-800">
            <button
              (click)="onEditName()"
              class="flex items-center justify-between w-full px-6 py-4 hover:bg-surface-50 dark:hover:bg-surface-800 transition-colors border-0 bg-transparent cursor-pointer text-left"
            >
              <div class="flex items-center gap-3">
                <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-surface-100 dark:bg-surface-800 shrink-0">
                  <i class="pi pi-user-edit text-surface-600 dark:text-surface-300 text-sm"></i>
                </div>
                <div>
                  <p class="text-sm font-medium text-surface-900 dark:text-surface-0">Cambiar Nombre de Usuario</p>
                  <p class="text-xs text-surface-500 dark:text-surface-400">Actualiza cómo apareces en el sistema</p>
                </div>
              </div>
              <i class="pi pi-chevron-right text-surface-400 text-sm"></i>
            </button>
          </div>

          <div class="border-t border-surface-100 dark:border-surface-800">
            <button
              (click)="onChangePassword()"
              class="flex items-center justify-between w-full px-6 py-4 hover:bg-surface-50 dark:hover:bg-surface-800 transition-colors border-0 bg-transparent cursor-pointer text-left"
            >
              <div class="flex items-center gap-3">
                <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-surface-100 dark:bg-surface-800 shrink-0">
                  <i class="pi pi-key text-surface-600 dark:text-surface-300 text-sm"></i>
                </div>
                <div>
                  <p class="text-sm font-medium text-surface-900 dark:text-surface-0">Cambiar Contraseña</p>
                  <p class="text-xs text-surface-500 dark:text-surface-400">Mantén tu cuenta segura</p>
                </div>
              </div>
              <i class="pi pi-chevron-right text-surface-400 text-sm"></i>
            </button>
          </div>
        </div>
      }
    </div>
  </div>
