<app-main-layout>
  <div class="flex justify-center px-4 py-8">
    <div class="w-full max-w-2xl">
      <div class="text-center mb-8">
        <h1
          class="text-3xl font-bold text-surface-900 dark:text-surface-0 mb-2"
        >
          Configuración de Cuenta
        </h1>
      </div>
      <p-card styleClass="border border-surface-200 dark:border-surface-700">
        @if (currentUser()) {
          <div class="flex flex-col items-center mb-6">
            <p-avatar
              [label]="getInitials()"
              size="xlarge"
              [style]="{
                'background-color': '#2196F3',
                color: '#ffffff',
                'font-size': '2rem',
              }"
              styleClass="mb-4"
            />
            <h2
              class="text-2xl font-semibold text-surface-900 dark:text-surface-0 mb-1"
            >
              {{ currentUser()!.displayName }}
            </h2>
            <p class="text-surface-600 dark:text-surface-400 mb-1">
              {{ currentUser()!.email }}
            </p>
            <p class="text-surface-500 dark:text-surface-400 text-sm mb-4">
              Miembro desde {{ currentUser()!.createdAt | date: "mediumDate" }}
            </p>
            <div class="flex gap-2">
              <span
                class="px-3 py-1 rounded-full text-sm font-semibold"
                [ngClass]="
                  currentUser()!.active
                    ? 'bg-green-100 dark:bg-green-900 text-green-700 dark:text-green-300'
                    : 'bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-300'
                "
              >
                {{ currentUser()!.active ? "Activo" : "Inactivo" }}
              </span>
              <span
                class="px-3 py-1 rounded-full text-sm font-semibold bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300"
              >
                {{ getUserTypeLabel(currentUser()!.type) }}
              </span>
            </div>
          </div>
          <p-divider />
          <div class="flex flex-col gap-3 mt-6">
            <p-button
              label="Cambiar Nombre de Usuario"
              icon="pi pi-user-edit"
              severity="secondary"
              [outlined]="true"
              styleClass="w-full justify-center"
              (onClick)="onEditName()"
            />
            <p-button
              label="Cambiar Contraseña"
              icon="pi pi-key"
              severity="secondary"
              [outlined]="true"
              styleClass="w-full justify-center"
              (onClick)="onChangePassword()"
            />
          </div>
        }
      </p-card>
    </div>
  </div>
</app-main-layout>
